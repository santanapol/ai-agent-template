# Ephemeral observability stack for harness dev (per PORT_OFFSET).
# Started by scripts/dev/dev-obs-up.sh — not for production.

services:
  victoria-logs:
    image: victoriametrics/victoria-logs:v1.15.0-victorialogs
    container_name: zero-platform-vlogs-${PORT_OFFSET:-0}
    ports:
      - '${VLOGS_PORT:-9428}:9428'
    command:
      - '-storageDataPath=/vlogs'
      - '-httpListenAddr=:9428'
    restart: unless-stopped

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.115.0
    container_name: zero-platform-vmetrics-${PORT_OFFSET:-0}
    ports:
      - '${VMETRICS_PORT:-8428}:8428'
    command:
      - '-storageDataPath=/vmetrics'
      - '-httpListenAddr=:8428'
      - '-promscrape.config=/etc/prometheus/prometheus.yml'
    volumes:
      - ${DEV_RUN_DIR:-.dev-run/0}/prometheus-scrape.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  vector:
    image: timberio/vector:0.43.1-alpine
    container_name: zero-platform-vector-${PORT_OFFSET:-0}
    volumes:
      - ./observability/vector.toml:/etc/vector/vector.toml:ro
      - ${DEV_RUN_DIR:-../../.dev-run/0}/logs:/var/log/harness:ro
    environment:
      PORT_OFFSET: ${PORT_OFFSET:-0}
      AUTH_PORT: ${AUTH_PORT:-3001}
      GATEWAY_PORT: ${GATEWAY_PORT:-3000}
      STAFF_PORT: ${STAFF_PORT:-3101}
      VLOGS_URL: http://victoria-logs:9428
      VMETRICS_URL: http://victoria-metrics:8428
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - victoria-logs
      - victoria-metrics
    restart: unless-stopped
