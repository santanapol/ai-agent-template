# Local dev dependencies for zero-platform.
# Usage: from this directory — `docker compose up -d`
#
# Point auth + gateway `.env` at the same URL:
#   REDIS_URL=redis://127.0.0.1:6379/0

services:
  redis:
    image: redis:8-alpine
    container_name: zero-platform-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  mongodb:
    image: mongo:8
    container_name: zero-platform-mongodb
    ports:
      - '27017:27017'
    volumes:
      - zero-platform-mongodb-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  zero-platform-mongodb-data:
