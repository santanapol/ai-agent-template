# Prometheus scrape targets on host (services run via npm, not in Docker).
scrape_configs:
  - job_name: harness-services
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'host.docker.internal:3001'
          - 'host.docker.internal:3000'
          - 'host.docker.internal:3101'
        labels:
          port_offset: '0'
