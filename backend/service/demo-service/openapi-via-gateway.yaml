openapi: 3.1.0
info:
  title: demo-service
  version: 0.1.1
  contact:
    name: engineering
    url: https://example.invalid/demo-service
  description: |
    **Client import** for calling **`demo-service`** routes through **`gateway`** (default listen **`3002`**).

    Send **`Authorization: Bearer <access JWT>`** only — **`gateway`** verifies JWT, injects **`x-gateway-secret`** and **`x-user-*`**, and proxies to this service. Do **not** send mesh headers from untrusted clients.

    **Normative JSON shapes** (envelopes, `Item`, errors): reuse definitions in **[`./openapi.yaml`](./openapi.yaml)** via `$ref` below.

    **Gateway edge behaviour** (JWT failures as `application/problem+json`, proxy rules): **[`../../../gateway/openapi.yaml`](../../../gateway/openapi.yaml)** and **[`../../../gateway/docs/architecture.md`](../../../gateway/docs/architecture.md)**.

    Monorepo route table (prefix → upstream) for this demo: **[`../../../gateway/routes.json`](../../../gateway/routes.json)** (`/api/v1/items`, `/api/v1/me` → `http://127.0.0.1:3003`).

    Service design: [`docs/architecture.md`](./docs/architecture.md).
  license:
    name: LicenseRef-Proprietary
    url: https://example.invalid/license

servers:
  - url: http://localhost:3000/api/v1:{port}
    description: Local gateway
    variables:
      port:
        default: "3000"
        description: gateway `PORT` (see `gateway/.env.example`).

security:
  - BearerJwt: []

tags:
  - name: me
    description: Proxied `GET /api/v1/me` — identity from JWT-derived headers injected by gateway.
  - name: items
    description: Proxied CRUD on `/api/v1/items` (tenant from JWT-derived headers).

paths:
  /api/v1/me:
    get:
      tags: [me]
      summary: Current user context (via gateway)
      description: |
        Same response body as direct mesh **`GET /api/v1/me`** in [`./openapi.yaml`](./openapi.yaml); client supplies **Bearer JWT** only.
      operationId: getMeViaGateway
      security:
        - BearerJwt: []
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              $ref: "./openapi.yaml#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/MeEnvelope"
        "400":
          $ref: "./openapi.yaml#/components/responses/InvalidHeader"
        "401":
          $ref: "./openapi.yaml#/components/responses/GatewayAuthFailed"
        "403":
          $ref: "./openapi.yaml#/components/responses/MissingUserContext"
        "429":
          $ref: "./openapi.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./openapi.yaml#/components/responses/InternalError"

  /api/v1/items:
    get:
      tags: [items]
      summary: List items (via gateway)
      description: Same list contract as [`./openapi.yaml`](./openapi.yaml) `listItems`.
      operationId: listItemsViaGateway
      security:
        - BearerJwt: []
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              $ref: "./openapi.yaml#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ListItemsEnvelope"
        "400":
          $ref: "./openapi.yaml#/components/responses/InvalidHeader"
        "401":
          $ref: "./openapi.yaml#/components/responses/GatewayAuthFailed"
        "403":
          $ref: "./openapi.yaml#/components/responses/MissingUserContext"
        "429":
          $ref: "./openapi.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./openapi.yaml#/components/responses/InternalError"

    post:
      tags: [items]
      summary: Create item (via gateway)
      description: Same body and responses as [`./openapi.yaml`](./openapi.yaml) `createItem`.
      operationId: createItemViaGateway
      security:
        - BearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./openapi.yaml#/components/schemas/CreateItem"
      responses:
        "201":
          description: Created
          headers:
            x-request-id:
              $ref: "./openapi.yaml#/components/headers/XRequestId"
            Location:
              $ref: "./openapi.yaml#/components/headers/Location"
            ETag:
              $ref: "./openapi.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ItemEnvelope"
        "400":
          $ref: "./openapi.yaml#/components/responses/InvalidParam"
        "401":
          $ref: "./openapi.yaml#/components/responses/GatewayAuthFailed"
        "403":
          $ref: "./openapi.yaml#/components/responses/MissingUserContext"
        "409":
          $ref: "./openapi.yaml#/components/responses/ItemDuplicate"
        "415":
          $ref: "./openapi.yaml#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "./openapi.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./openapi.yaml#/components/responses/InternalError"

  /api/v1/items/{itemId}:
    parameters:
      - in: path
        name: itemId
        required: true
        description: Item id (24-char hex ObjectId string).
        schema:
          type: string
        example: "<item-id>"
    get:
      tags: [items]
      summary: Get item by id (via gateway)
      description: Same as [`./openapi.yaml`](./openapi.yaml) `getItemById`.
      operationId: getItemByIdViaGateway
      security:
        - BearerJwt: []
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              $ref: "./openapi.yaml#/components/headers/XRequestId"
            ETag:
              $ref: "./openapi.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ItemEnvelope"
        "400":
          $ref: "./openapi.yaml#/components/responses/InvalidHeader"
        "401":
          $ref: "./openapi.yaml#/components/responses/GatewayAuthFailed"
        "403":
          $ref: "./openapi.yaml#/components/responses/MissingUserContext"
        "404":
          $ref: "./openapi.yaml#/components/responses/ItemNotFound"
        "429":
          $ref: "./openapi.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./openapi.yaml#/components/responses/InternalError"

    put:
      tags: [items]
      summary: Replace item (via gateway)
      description: |
        Same as [`./openapi.yaml`](./openapi.yaml) `replaceItem` — client still sends **`If-Match`** (weak ETag).
        Teaching `PUT` pattern: [`docs/adrs/001-put-full-replace.md`](./docs/adrs/001-put-full-replace.md).
      operationId: replaceItemViaGateway
      security:
        - BearerJwt: []
      parameters:
        - $ref: "./openapi.yaml#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./openapi.yaml#/components/schemas/ReplaceItem"
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              $ref: "./openapi.yaml#/components/headers/XRequestId"
            ETag:
              $ref: "./openapi.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ItemEnvelope"
        "400":
          $ref: "./openapi.yaml#/components/responses/InvalidParam"
        "401":
          $ref: "./openapi.yaml#/components/responses/GatewayAuthFailed"
        "403":
          $ref: "./openapi.yaml#/components/responses/MissingUserContext"
        "404":
          $ref: "./openapi.yaml#/components/responses/ItemNotFound"
        "412":
          $ref: "./openapi.yaml#/components/responses/VersionConflict"
        "415":
          $ref: "./openapi.yaml#/components/responses/UnsupportedMediaType"
        "428":
          $ref: "./openapi.yaml#/components/responses/PreconditionRequired"
        "429":
          $ref: "./openapi.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./openapi.yaml#/components/responses/InternalError"

    patch:
      tags: [items]
      summary: Update item (via gateway)
      description: Same as [`./openapi.yaml`](./openapi.yaml) `updateItem` — **`If-Match`** required.
      operationId: updateItemViaGateway
      security:
        - BearerJwt: []
      parameters:
        - $ref: "./openapi.yaml#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./openapi.yaml#/components/schemas/PatchItem"
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              $ref: "./openapi.yaml#/components/headers/XRequestId"
            ETag:
              $ref: "./openapi.yaml#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ItemEnvelope"
        "400":
          $ref: "./openapi.yaml#/components/responses/InvalidParam"
        "401":
          $ref: "./openapi.yaml#/components/responses/GatewayAuthFailed"
        "403":
          $ref: "./openapi.yaml#/components/responses/MissingUserContext"
        "404":
          $ref: "./openapi.yaml#/components/responses/ItemNotFound"
        "412":
          $ref: "./openapi.yaml#/components/responses/VersionConflict"
        "415":
          $ref: "./openapi.yaml#/components/responses/UnsupportedMediaType"
        "428":
          $ref: "./openapi.yaml#/components/responses/PreconditionRequired"
        "429":
          $ref: "./openapi.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./openapi.yaml#/components/responses/InternalError"

    delete:
      tags: [items]
      summary: Delete item (via gateway)
      description: Same as [`./openapi.yaml`](./openapi.yaml) `deleteItem` — **`If-Match`** required.
      operationId: deleteItemViaGateway
      security:
        - BearerJwt: []
      parameters:
        - $ref: "./openapi.yaml#/components/parameters/IfMatch"
      responses:
        "200":
          description: Deleted
          headers:
            x-request-id:
              $ref: "./openapi.yaml#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/DeleteEnvelope"
        "400":
          $ref: "./openapi.yaml#/components/responses/InvalidHeader"
        "401":
          $ref: "./openapi.yaml#/components/responses/GatewayAuthFailed"
        "403":
          $ref: "./openapi.yaml#/components/responses/MissingUserContext"
        "404":
          $ref: "./openapi.yaml#/components/responses/ItemNotFound"
        "412":
          $ref: "./openapi.yaml#/components/responses/VersionConflict"
        "428":
          $ref: "./openapi.yaml#/components/responses/PreconditionRequired"
        "429":
          $ref: "./openapi.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./openapi.yaml#/components/responses/InternalError"

components:
  securitySchemes:
    BearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256 access JWT verified by **gateway** (`JWT_JWKS_URL`, optional issuer/audience per gateway SoT).
        Align name/shape with **`gateway`** [`../../../gateway/openapi.yaml`](../../../gateway/openapi.yaml) (`BearerJwt`).
