opencollection: 1.0.0

info:
  name: demo-service
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: apikey
    key: x-gateway-secret
    value: "{{apiKey}}"
    placement: header
  variables:
    - name: apiKey
      value: WSgEKTV8ci7UguW6qRDPsMJNBnI4l7lU
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
