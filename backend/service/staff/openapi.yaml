openapi: 3.1.0
info:
  title: staff-service
  version: 0.1.0
  description: |
    Internal **staff** service — manages `staff_profiles` behind gateway mesh headers.

    Business / persistence SoT: [`docs/business-domain.md`](./docs/business-domain.md), [`docs/database-erd.md`](./docs/database-erd.md).

    Direct listen port: `3004` (`PORT` env). Gateway prefix: `/api/v1/staff` → this upstream.

    For Bruno/Postman through gateway, import [`openapi-via-gateway.yaml`](./openapi-via-gateway.yaml).
  contact:
    name: engineering
    url: https://example.invalid/staff-service
  license:
    name: LicenseRef-Proprietary
    url: https://example.invalid/license

servers:
  - url: http://127.0.0.1:{port}
    description: Local (internal — mesh only)
    variables:
      port:
        default: "3101"
        description: Direct service listen port (`PORT` env).

security:
  - GatewaySecret: []

tags:
  - name: health
    description: Liveness and readiness (no `x-gateway-secret` at runtime)
  - name: internal
    description: Internal mesh endpoints (`/metrics`)
  - name: profiles
    description: Staff profiles (`/api/v1/staff/profiles`)

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness
      description: Process liveness probe (no Mongo required).
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /readyz:
    get:
      tags: [health]
      summary: Readiness
      description: MongoDB ping; returns 503 when database is unreachable.
      operationId: getReadyz
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "503":
          description: Dependency unavailable
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /metrics:
    get:
      tags: [internal]
      summary: Prometheus metrics
      description: Prometheus text exposition (mesh secret required).
      operationId: getMetrics
      security:
        - GatewaySecret: []
      parameters:
        - $ref: "#/components/parameters/AcceptMetrics"
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/GatewayAuthFailed"

  /api/v1/staff/profiles:
    get:
      tags: [profiles]
      summary: List or lookup staff profiles
      description: |
        **List mode**: Omit `user_id` — supports `q`, `status`, `branch_id`, `sort`, pagination. Requires permission `profiles:list`.

        **Lookup mode**: `user_id={hex24}` — returns a single profile object (no `pagination`). Requires permission `profiles:lookup` (except when looking up own profile).

        **Do not** combine `user_id` with list query parameters (`q`, `page`, …) → `400 INVALID_PARAM`.
      operationId: listOrLookupProfiles
      security:
        - GatewaySecret: []
      parameters:
        - $ref: "#/components/parameters/XUserOu"
        - $ref: "#/components/parameters/XUserBranch"
        - $ref: "#/components/parameters/XUserHomeBranch"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XUserRole"
        - $ref: "#/components/parameters/UserIdLookup"
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/BranchIdFilter"
        - $ref: "#/components/parameters/SearchQ"
        - $ref: "#/components/parameters/SortProfiles"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Success (list array or single lookup object in `data`)
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProfileEnvelope"
                  - $ref: "#/components/schemas/ListProfilesEnvelope"
        "400":
          $ref: "#/components/responses/InvalidParam"
        "401":
          $ref: "#/components/responses/GatewayAuthFailed"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/ProfileNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [profiles]
      summary: Create staff profile
      description: |
        Admin create. When `user_id` is omitted, **`username`** and **`password`** are required (provision via auth internal).
        When `user_id` is provided, link an existing auth user (no `username` / `password`).
        Requires permission `profiles:create`.
      operationId: createProfile
      security:
        - GatewaySecret: []
      parameters:
        - $ref: "#/components/parameters/XUserOu"
        - $ref: "#/components/parameters/XUserBranch"
        - $ref: "#/components/parameters/XUserHomeBranch"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XUserRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfile"
      responses:
        "201":
          description: Created
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "400":
          $ref: "#/components/responses/InvalidParam"
        "401":
          $ref: "#/components/responses/GatewayAuthFailed"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ProfileDuplicate"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/staff/profiles/{profileId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      tags: [profiles]
      summary: Get profile by id
      description: Returns one profile when it exists within caller tenant scope. Requires permission `profiles:read` (except when retrieving own profile).
      operationId: getProfileById
      security:
        - GatewaySecret: []
      parameters:
        - $ref: "#/components/parameters/XUserOu"
        - $ref: "#/components/parameters/XUserBranch"
        - $ref: "#/components/parameters/XUserHomeBranch"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XUserRole"
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "400":
          $ref: "#/components/responses/InvalidHeader"
        "401":
          $ref: "#/components/responses/GatewayAuthFailed"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/ProfileNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [profiles]
      summary: Update profile fields
      description: |
        Partial update with **`If-Match`** (weak ETag from `upd_date`).
        Own profile: `code` in body is ignored. **Do not** send `status` or `password` here.
        Requires permission `profiles:edit` (except when updating own profile).
      operationId: updateProfile
      security:
        - GatewaySecret: []
      parameters:
        - $ref: "#/components/parameters/XUserOu"
        - $ref: "#/components/parameters/XUserBranch"
        - $ref: "#/components/parameters/XUserHomeBranch"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XUserRole"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/PatchProfile"
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProfile"
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "400":
          $ref: "#/components/responses/InvalidParam"
        "401":
          $ref: "#/components/responses/GatewayAuthFailed"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/ProfileNotFound"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/staff/profiles/{profileId}/role:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    patch:
      tags: [profiles]
      summary: Assign system role
      description: |
        Admin assigns a new system role to the profile.
        Requires permission `roles:assign`.
      operationId: assignRole
      security:
        - GatewaySecret: []
      parameters:
        - $ref: "#/components/parameters/XUserOu"
        - $ref: "#/components/parameters/XUserBranch"
        - $ref: "#/components/parameters/XUserHomeBranch"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XUserRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum:
                    [
                      platform_admin,
                      branch_admin,
                      staff,
                      support,
                      support_admin,
                    ]
      responses:
        "204":
          description: Role updated
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
        "400":
          $ref: "#/components/responses/InvalidParam"
        "401":
          $ref: "#/components/responses/GatewayAuthFailed"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/ProfileNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/staff/profiles/{profileId}/archive:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      tags: [profiles]
      summary: Archive profile (soft delete)
      description: Sets `status` to `archived` then revokes auth sessions. If revoke fails after persist → `503 STAFF_AUTH_REVOKE_PENDING`. Requires permission `profiles:edit`.
      operationId: archiveProfile
      security:
        - GatewaySecret: []
      parameters:
        - $ref: "#/components/parameters/XUserOu"
        - $ref: "#/components/parameters/XUserBranch"
        - $ref: "#/components/parameters/XUserHomeBranch"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XUserRole"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Archived
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "400":
          $ref: "#/components/responses/InvalidHeader"
        "401":
          $ref: "#/components/responses/GatewayAuthFailed"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/ProfileNotFound"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/StaffAuthRevokePending"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/staff/profiles/{profileId}/restore:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      tags: [profiles]
      summary: Restore archived profile
      description: Sets `status` to `active` with optimistic concurrency (`If-Match`). Requires permission `profiles:edit`.
      operationId: restoreProfile
      security:
        - GatewaySecret: []
      parameters:
        - $ref: "#/components/parameters/XUserOu"
        - $ref: "#/components/parameters/XUserBranch"
        - $ref: "#/components/parameters/XUserHomeBranch"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XUserRole"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Restored to active
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "400":
          $ref: "#/components/responses/InvalidHeader"
        "401":
          $ref: "#/components/responses/GatewayAuthFailed"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/ProfileNotFound"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/staff/profiles/{profileId}/password:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      tags: [profiles]
      summary: Admin reset password
      description: |
        Admin sets a new password for another user's profile (not own profile).
        Delegates to auth internal; optional session revoke (default `true`).
        Requires permission `profiles:edit`.
      operationId: adminResetPassword
      security:
        - GatewaySecret: []
      parameters:
        - $ref: "#/components/parameters/XUserOu"
        - $ref: "#/components/parameters/XUserBranch"
        - $ref: "#/components/parameters/XUserHomeBranch"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XUserRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordReset"
      responses:
        "204":
          description: Password updated
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
        "400":
          $ref: "#/components/responses/InvalidParam"
        "401":
          $ref: "#/components/responses/GatewayAuthFailed"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/ProfileNotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    GatewaySecret:
      type: apiKey
      in: header
      name: x-gateway-secret
      description: |
        Non-secret placeholder for API clients: `<GATEWAY_SECRET>`.
        Replace with the real shared secret from env (must match gateway / service config).

  parameters:
    AcceptMetrics:
      name: Accept
      in: header
      required: false
      schema:
        type: string
      example: text/plain

    ProfileId:
      name: profileId
      in: path
      required: true
      description: Profile id (24-char hex ObjectId).
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
      example: "507f1f77bcf86cd799439011"

    XUserOu:
      name: x-user-ou
      in: header
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
      example: "507f1f77bcf86cd799439011"

    XUserBranch:
      name: x-user-branch
      in: header
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
      example: "507f1f77bcf86cd799439012"

    XUserHomeBranch:
      name: x-user-home-branch
      in: header
      required: false
      description: |
        User's permanent home branch (JWT `home_branch_id`). Used for OU-wide self-profile
        lookup when active `x-user-branch` differs from home. Omitted on legacy tokens.
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
      example: "507f1f77bcf86cd799439012"

    XUserId:
      name: x-user-id
      in: header
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
      example: "507f1f77bcf86cd799439013"

    XUserRole:
      name: x-user-role
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
      example: branch_admin

    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Weak ETag from last read (`upd_date`).
      schema:
        type: string
      example: '"2026-05-28T00:00:00.000Z"'

    UserIdLookup:
      name: user_id
      in: query
      required: false
      description: Lookup by `auth_users._id` (hex24). Mutually exclusive with list params.
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"

    StatusFilter:
      name: status
      in: query
      required: false
      description: List filter (default `active`).
      schema:
        type: string
        enum: [active, archived, all]
        default: active

    BranchIdFilter:
      name: branch_id
      in: query
      required: false
      description: Optional branch filter (`platform_admin`); enforced for `branch_admin`.
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"

    SearchQ:
      name: q
      in: query
      required: false
      description: Case-insensitive substring on code, names, username (join).
      schema:
        type: string
        maxLength: 128

    SortProfiles:
      name: sort
      in: query
      required: false
      description: Sort field; prefix `-` for descending. Default `-upd_date`.
      schema:
        type: string
        pattern: "^-?(code|firstname|lastname|upd_date)$"
        default: "-upd_date"

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    XRequestId:
      description: Request correlation id
      schema:
        type: string
    ETag:
      description: Weak ETag from `upd_date`
      schema:
        type: string
    Location:
      description: URI of created profile
      schema:
        type: string

  schemas:
    Envelope:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: ["string", "null"]
        data: {}
        pagination:
          $ref: "#/components/schemas/Pagination"
        requestId:
          type: string

    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [success, code, message, requestId]
          properties:
            success:
              type: boolean
              const: false
            data:
              type: ["null"]
            requestId:
              type: string

    UserSnippet:
      type: object
      required: [username, role]
      properties:
        username:
          type: string
        role:
          type: string

    Profile:
      type: object
      required:
        - id
        - user_id
        - ou_id
        - branch_id
        - status
        - code
        - firstname
        - lastname
        - email
        - tel
        - user
      properties:
        id:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"
        user_id:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"
        ou_id:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"
        branch_id:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"
        status:
          type: string
          enum: [active, archived]
        code:
          type: string
          maxLength: 32
        firstname:
          type: string
          maxLength: 128
        lastname:
          type: string
          maxLength: 128
        email:
          type: string
          maxLength: 254
        tel:
          type: string
          maxLength: 16
        user:
          $ref: "#/components/schemas/UserSnippet"

    ProfileEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [success, code, message, data]
          properties:
            success:
              type: boolean
              const: true
            code:
              type: string
              const: SUCCESS
            message:
              type: ["string", "null"]
            data:
              $ref: "#/components/schemas/Profile"

    ListProfilesEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [success, code, message, data, pagination]
          properties:
            success:
              type: boolean
              const: true
            code:
              type: string
              const: SUCCESS
            message:
              type: ["string", "null"]
            data:
              type: array
              items:
                $ref: "#/components/schemas/Profile"
            pagination:
              $ref: "#/components/schemas/Pagination"

    CreateProfile:
      type: object
      additionalProperties: false
      required: [code, firstname, lastname, email, tel]
      properties:
        code:
          type: string
          maxLength: 32
        firstname:
          type: string
          maxLength: 128
        lastname:
          type: string
          maxLength: 128
        email:
          type: string
          maxLength: 254
        tel:
          type: string
          maxLength: 16
        user_id:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"
        username:
          type: string
          maxLength: 128
          description: Required when provisioning (no `user_id`); lowercase unique in auth.
        password:
          type: string
          minLength: 8
          maxLength: 256
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[^A-Za-z0-9]).+$'
          writeOnly: true
          format: password
          description: Required when provisioning (no `user_id`).
      oneOf:
        - required: [user_id]
          not:
            anyOf:
              - required: [username]
              - required: [password]
        - required: [username, password]
          not:
            required: [user_id]

    PatchProfile:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          maxLength: 32
        firstname:
          type: string
          maxLength: 128
        lastname:
          type: string
          maxLength: 128
        email:
          type: string
          maxLength: 254
        tel:
          type: string
          maxLength: 16

    AdminPasswordReset:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 256
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[^A-Za-z0-9]).+$'
          writeOnly: true
          format: password
        revoke_sessions:
          type: boolean
          default: true

  responses:
    InvalidParam:
      description: Request validation failed
      headers:
        x-request-id:
