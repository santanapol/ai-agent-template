  /api/v1/invoices/generate:
    post:
      operationId: postInvoicesGenerate
      tags: [invoices]
      summary: Generate invoices for a billing month
      description: |
        Invoice cycle label is `month` (YYYY-MM). Bet summary aggregation uses the previous calendar month
        in each branch timezone (e.g. month 2026-06 → May 2026 play data). Sets due_date to {month}-15.
        Triggers in-process fee calculation for invoices with transactions.
        Branches and invoices are scoped to `ou_id` matching `x-user-ou`.
      parameters:
        - $ref: "#/components/parameters/xUserOu"
        - $ref: "#/components/parameters/xUserBranch"
        - $ref: "#/components/parameters/xUserId"
        - $ref: "#/components/parameters/xUserRole"
        - $ref: "#/components/parameters/xRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "200":
          description: Batch completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Partial batch failure — some invoices failed fee calculation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartialFailureResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/invoices/calculate-fee:
    post:
      operationId: postInvoicesCalculateFee
      tags: [invoices]
      summary: Calculate provider fees for an invoice
      description: |
        Calculates transaction fees using agent_fee percentages (e.g. 8 = 8%). Requires If-Match from a prior GET detail or calculate-fee response.
        Invoice must belong to `ou_id` matching `x-user-ou`.
      parameters:
        - $ref: "#/components/parameters/xUserOu"
        - $ref: "#/components/parameters/xUserBranch"
        - $ref: "#/components/parameters/xUserId"
        - $ref: "#/components/parameters/xUserRole"
        - $ref: "#/components/parameters/ifMatch"
        - $ref: "#/components/parameters/xRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateFeeRequest"
      responses:
        "200":
          description: Calculation result
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculateFeeSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List invoices with filters
      description: |
        Paginated invoice list filtered by optional query params (iv_no, branch_id, billing_month, status).
        Results are scoped to `ou_id` matching `x-user-ou`.
      parameters:
        - $ref: "#/components/parameters/xUserOu"
        - $ref: "#/components/parameters/xUserBranch"
        - $ref: "#/components/parameters/xUserId"
        - $ref: "#/components/parameters/xUserRole"
        - $ref: "#/components/parameters/xRequestId"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: iv_no
          in: query
          schema:
            type: string
        - name: branch_id
          in: query
          schema:
            type: string
            minLength: 24
            maxLength: 24
            pattern: '^[a-f0-9]{24}$'
        - name: billing_month
          in: query
          schema:
            type: string
            pattern: '^\\d{4}-(0[1-9]|1[0-2])$'
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, VOID, CAL, MISSING_FEE, READY, ERROR, PAID]
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListInvoicesSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/invoices/agent:
    get:
      operationId: listInvoiceAgents
      tags: [invoices]
      summary: List branches for invoice operations
      description: |
        Returns branches from `gpp_777ww.su_branch` filtered by `ou_id` matching `x-user-ou`.
      parameters:
        - $ref: "#/components/parameters/xUserOu"
        - $ref: "#/components/parameters/xUserBranch"
