info:
  name: Refresh token
  type: http
  seq: 3
  tags:
    - proxy

http:
  method: POST
  url: "{{baseUrl}}/auth/refresh"
  headers:
    - name: Accept
      value: application/json
      description: Optional; successful JSON responses use `application/json` (or `application/problem+json` for errors).
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{refresh_token}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 || (typeof res.getStatus === 'function' && res.getStatus() === 200)) {
          var body = typeof res.getBody === 'function' ? res.getBody() : res.body;
          if (body && body.access_token) {
            bru.setEnvVar("access_token", body.access_token);
          }
          if (body && body.refresh_token) {
            bru.setEnvVar("refresh_token", body.refresh_token);
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

