info:
  name: Login
  type: http
  seq: 2
  tags:
    - proxy

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "password": "{{password}}",
        "client_kind": "native"
      }
  auth: inherit

runtime:
  variables:
    - name: username
      value: admin
    - name: password
      value: "1234"
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 || (typeof res.getStatus === 'function' && res.getStatus() === 200)) {
          var body = typeof res.getBody === 'function' ? res.getBody() : res.body;
          if (body && body.access_token) {
            bru.setEnvVar("access_token", body.access_token);
          }
          if (body && body.refresh_token) {
            bru.setEnvVar("refresh_token", body.refresh_token);
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response (Default JSON body (Bruno / Postman import))
    description: Success — JSON token payload and/or `Set-Cookie` per auth docs.
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      headers:
        - name: Accept
          value: application/json
      body:
        type: json
        data: |-
          {
            "username": "{{username}}",
            "password": "{{password}}",
            "client_kind": "native"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
  - name: 400 Response (Default JSON body (Bruno / Postman import))
    description: Validation — `application/problem+json` per auth docs.
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      headers:
        - name: Accept
          value: application/json
      body:
        type: json
        data: |-
          {
            "username": "{{username}}",
            "password": "{{password}}",
            "client_kind": "native"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "code": "GATEWAY_CLAIM_REJECTED"
          }
  - name: 401 Response (Default JSON body (Bruno / Postman import))
    description: Invalid credentials — `application/problem+json`.
    request:
      url: "{{baseUrl}}/auth/login"
