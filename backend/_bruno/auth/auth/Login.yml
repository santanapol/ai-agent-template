info:
  name: Login
  type: http
  seq: 1
  tags:
    - auth

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "password": "{{password}}",
        "client_kind": "native"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 || (typeof res.getStatus === 'function' && res.getStatus() === 200)) {
          var body = typeof res.getBody === 'function' ? res.getBody() : res.body;
          if (body && body.access_token) {
            bru.setEnvVar("access_token", body.access_token);
          }
          if (body && body.refresh_token) {
            bru.setEnvVar("refresh_token", body.refresh_token);
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Native — refresh token in JSON body (Default body for client import (Bruno / Postman))
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "username": "{{username}}",
            "password": "{{password}}",
            "client_kind": "native"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "access_token": "<access-jwt-placeholder>",
            "token_type": "Bearer",
            "expires_in": 900,
            "refresh_token": "<opaque-refresh-placeholder>"
          }
  - name: Browser — refresh only in HttpOnly cookie (no `refresh_token` field) (Default body for client import (Bruno / Postman))
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "username": "{{username}}",
            "password": "{{password}}",
            "client_kind": "native"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "access_token": "<access-jwt-placeholder>",
            "token_type": "Bearer",
            "expires_in": 900
          }
  - name: invalidRequest (Default body for client import (Bruno / Postman))
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "username": "{{username}}",
            "password": "{{password}}",
            "client_kind": "native"
