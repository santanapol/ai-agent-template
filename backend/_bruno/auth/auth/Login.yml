            "client_kind": "native"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "https://example.invalid/auth/problems/invalid-credentials",
            "title": "Unauthorized",
            "status": 401,
