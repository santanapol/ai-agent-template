info:
  name: Change own password
  type: http
  seq: 4
  tags:
    - auth

http:
  method: POST
  url: "{{baseUrl}}/auth/me/password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "current_password": "1234",
        "new_password": "1234"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  variables:
    - name: token
      value: eyJhbGciOiJSUzI1NiIsImtpZCI6ImRlZmF1bHQifQ..BZHMUGxRMhQ5Ch3WHS3VcGa7Tp3LH7o6XvjHcBpWeqn82TN4ICVNwI_u117gi2CQq508lSoggEsz0UUbg06nF7fEg_OVhA_t9GIrWwph9xcFTdLRvt76DE_jfRHpeXfKaUDpLD2Z_xU9Ikxp3IGtNN0QWzVanZ0vL7w5vJG_Rrs43ZmixG3YTKJYzX0ISh1KKbuJ8sDQS2ToVX6PfqNfeW58ZZzmRebigDR7sj8AuOFFkdMsjZiP_s_YYHaEKPwi26GRRialM43lqr0kawLcYhxYUay8vbkLa3Y1CblRb_Y1VYmk2P3w1oahuG7s9KB5jinNs_HPHdq-mx86VQl_9Q

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: Password updated; sessions invalidated.
    request:
      url: "{{baseUrl}}/auth/me/password"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "current_password": "",
            "new_password": ""
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 400 Response
    description: Validation failed.
    request:
      url: "{{baseUrl}}/auth/me/password"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "current_password": "",
            "new_password": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "code": "AUTH_INVALID_REQUEST"
          }
  - name: 401 Response
    description: Missing/invalid Bearer or wrong current password.
    request:
      url: "{{baseUrl}}/auth/me/password"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "current_password": "",
            "new_password": ""
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "code": "AUTH_INVALID_REQUEST"
          }
  - name: 429 Response
    description: Rate limit exceeded.
    request:
      url: "{{baseUrl}}/auth/me/password"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "current_password": "",
            "new_password": ""
          }
    response:
      status: 429
      statusText: Too Many Requests
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "code": "AUTH_INVALID_REQUEST"
          }

docs: |
  Authenticated user changes password. Requires `current_password` and `new_password` (min 16).
  On success: bump `access_token_gen`, revoke refresh — client should sign in again.
  See [`docs/design-password-management.md`](./docs/design-password-management.md).
