info:
  name: Logout
  type: http
  seq: 3
  tags:
    - auth

http:
  method: POST
  url: "{{baseUrl}}/auth/logout"
  headers:
    - name: Content-Type
      value: application/json
    - name: Cookie
      value: refresh_token={{refresh_token}}
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{refresh_token}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 204 || (typeof res.getStatus === 'function' && res.getStatus() === 204) || res.status === 200 || (typeof res.getStatus === 'function' && res.getStatus() === 200)) {
          bru.setEnvVar("access_token", "");
          bru.setEnvVar("refresh_token", "");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response (Default native logout body (import))
    description: |
      Logout accepted — **no JSON body**. Client should clear local tokens; server may clear refresh cookie.
    request:
      url: "{{baseUrl}}/auth/logout"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Cookie
          value: refresh_token={{refresh_token}}
      body:
        type: json
        data: |-
          {
            "refresh_token": "{{refresh_token}}"
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
