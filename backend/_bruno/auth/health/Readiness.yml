info:
  name: Readiness
  type: http
  seq: 2
  tags:
    - health

http:
  method: GET
  url: "{{baseUrl}}/readyz"
  headers:
    - name: Accept
      value: application/json
      description: |
        Optional; JSON responses use `application/json` where applicable.

        Used on **GET** (`/healthz`, `/readyz`, `/.well-known/jwks.json`). Success prefers `application/json`; errors may be `application/problem+json` (RFC 7807).

        **POST `/auth/*`:** use **`#/components/parameters/ContentTypeApplicationJson`** (required) — not this parameter.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Mongo + Redis reachable
    request:
      url: "{{baseUrl}}/readyz"
      method: GET
      headers:
        - name: Accept
          value: application/json
          description: |
            Optional; JSON responses use `application/json` where applicable.

            Used on **GET** (`/healthz`, `/readyz`, `/.well-known/jwks.json`). Success prefers `application/json`; errors may be `application/problem+json` (RFC 7807).

            **POST `/auth/*`:** use **`#/components/parameters/ContentTypeApplicationJson`** (required) — not this parameter.
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "ok",
            "dependencies": [
              {
                "name": "mongodb",
                "status": "ok"
              },
              {
                "name": "redis",
                "status": "ok"
              }
            ]
          }
  - name: degraded
    request:
      url: "{{baseUrl}}/readyz"
      method: GET
      headers:
        - name: Accept
          value: application/json
          description: |
            Optional; JSON responses use `application/json` where applicable.

            Used on **GET** (`/healthz`, `/readyz`, `/.well-known/jwks.json`). Success prefers `application/json`; errors may be `application/problem+json` (RFC 7807).

            **POST `/auth/*`:** use **`#/components/parameters/ContentTypeApplicationJson`** (required) — not this parameter.
    response:
      status: 503
      statusText: Service Unavailable
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "https://example.invalid/auth/problems/not-ready",
            "title": "Service Unavailable",
            "status": 503,
            "detail": "Readiness check failed.",
            "code": "AUTH_NOT_READY"
          }

docs: |
  **Purpose:** Readiness probe before sending user traffic — verifies critical dependencies (at minimum MongoDB connectivity for this service).

  **Behaviour:** On success, returns JSON with `status` and a `dependencies` array (name + status per probed dependency). Probes at least **MongoDB**; when **`REDIS_URL`** is configured, also **`PING`** Redis and include a `redis` dependency entry. If any probe fails, returns **`503`** with **`application/problem+json`** (`Problem` schema) and required registry `code` (e.g. `AUTH_NOT_READY`).

  **Auth:** None.
