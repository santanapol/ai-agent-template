info:
  name: List role permissions
  type: http
  seq: 5
  tags:
    - admin

http:
  method: GET
  url: "{{baseUrl}}/auth/admin/role-permissions"
  params:
    - name: role
      value: "{{admin_test_role}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Returns `{ role_permissions: [...] }` filtered by `role` query param. Default role: `branch_admin`.
