info:
  name: Delete menu node
  type: http
  seq: 4
  tags:
    - admin

http:
  method: DELETE
  url: "{{baseUrl}}/auth/admin/menus/{{admin_test_menu_key}}"
  headers:
    - name: If-Match
      value: "{{menu_upd_date}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Deletes the SIT test menu node (`{{admin_test_menu_key}}`). Requires current `{{menu_upd_date}}`. Expect `204` on success; `409` if node has children or is referenced.
