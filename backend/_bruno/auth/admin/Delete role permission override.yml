info:
  name: Delete role permission override
  type: http
  seq: 7
  tags:
    - admin

http:
  method: DELETE
  url: "{{baseUrl}}/auth/admin/role-permissions/null/{{admin_test_role}}"
  params:
    - name: confirm
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Removes Global override for `{{admin_test_role}}` (falls back to default). Uses `?confirm=true` when active users exist. **No If-Match**. Cannot delete `platform_admin` mapping (400).
