info:
  name: Set user password (service)
  type: http
  seq: 2
  tags:
    - internal

http:
  method: POST
  url: "{{baseUrl}}/internal/users/:user_id/password"
  params:
    - name: user_id
      value: 507f1f77bcf86cd799439011
      type: path
      description: MongoDB ObjectId as 24-character lowercase/uppercase hex string.
  body:
    type: json
    data: |-
      {
        "password": "",
        "revoke_sessions": false,
        "reason": "",
        "correlation_id": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: Password updated.
    request:
      url: "{{baseUrl}}/internal/users/:user_id/password"
      method: POST
      params:
        - name: user_id
          value: 507f1f77bcf86cd799439011
          type: path
          description: MongoDB ObjectId as 24-character lowercase/uppercase hex string.
      body:
        type: json
        data: |-
          {
            "password": "",
            "revoke_sessions": false,
            "reason": "",
            "correlation_id": ""
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 400 Response
    description: Validation failed.
    request:
      url: "{{baseUrl}}/internal/users/:user_id/password"
      method: POST
      params:
        - name: user_id
          value: 507f1f77bcf86cd799439011
          type: path
          description: MongoDB ObjectId as 24-character lowercase/uppercase hex string.
      body:
        type: json
        data: |-
          {
            "password": "",
            "revoke_sessions": false,
            "reason": "",
            "correlation_id": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "code": "AUTH_INVALID_REQUEST"
          }
  - name: 401 Response
    description: Internal service authentication failed.
    request:
      url: "{{baseUrl}}/internal/users/:user_id/password"
      method: POST
      params:
        - name: user_id
          value: 507f1f77bcf86cd799439011
          type: path
          description: MongoDB ObjectId as 24-character lowercase/uppercase hex string.
      body:
        type: json
        data: |-
          {
            "password": "",
            "revoke_sessions": false,
            "reason": "",
            "correlation_id": ""
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "code": "AUTH_INVALID_REQUEST"
          }
  - name: 404 Response
    description: User not found.
    request:
      url: "{{baseUrl}}/internal/users/:user_id/password"
      method: POST
      params:
        - name: user_id
          value: 507f1f77bcf86cd799439011
          type: path
          description: MongoDB ObjectId as 24-character lowercase/uppercase hex string.
      body:
        type: json
        data: |-
          {
            "password": "",
            "revoke_sessions": false,
            "reason": "",
            "correlation_id": ""
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
