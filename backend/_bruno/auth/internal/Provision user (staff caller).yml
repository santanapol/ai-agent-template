info:
  name: Provision user (staff caller)
  type: http
  seq: 1
  tags:
    - internal

http:
  method: POST
  url: "{{baseUrl}}/internal/users"
  body:
    type: json
    data: |-
      {
        "ou_id": "",
        "branch_id": "",
        "username": "",
        "password": "",
        "role": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
