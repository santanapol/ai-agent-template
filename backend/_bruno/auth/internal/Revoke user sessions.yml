docs: |
  **Purpose:** Trusted caller (e.g. staff after profile archive) revokes all active refresh sessions for `user_id` and bumps `access_token_gen` so gateway can reject stale access JWTs via `token_gen` claim (O-16).

  **Auth:** `Authorization: Bearer <AUTH_INTERNAL_SERVICE_SECRET>` — constant-time verification; separate from gateway mesh secret.

  **Idempotency:** Repeat calls with the same existing `user_id` return **200**; `revoked_refresh_tokens` may be **0** when no active refresh rows remain; **`access_token_gen` still increments on every successful call** (by design). Unknown `user_id` → **404** (`AUTH_USER_NOT_FOUND`). When **`REDIS_URL`** is set, Redis publish failure after DB bump → **503** (`AUTH_NOT_READY`, fail-closed).

  **Network:** Must not be exposed on public internet without private network / mTLS controls (O-15).
