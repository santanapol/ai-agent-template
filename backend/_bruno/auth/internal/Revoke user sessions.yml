info:
  name: Revoke user sessions
  type: http
  seq: 3
  tags:
    - internal

http:
  method: POST
  url: "{{baseUrl}}/internal/users/:user_id/sessions/revoke"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: user_id
      value: 507f1f77bcf86cd799439011
      type: path
      description: MongoDB ObjectId as 24-character lowercase/uppercase hex string.
  body:
    type: json
    data: |-
      {
        "reason": "staff.profile_archive",
        "correlation_id": "corr-01HX-example"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

