info:
  name: Generate invoices for a billing month
  type: http
  seq: 1
  tags:
    - invoices

http:
  method: POST
  url: "{{baseUrl}}/api/v1/invoices/generate"
  headers:
    - name: x-user-ou
      value: "{{ouId}}"
    - name: x-user-branch
      value: "{{branchId}}"
    - name: x-user-id
      value: "{{userId}}"
    - name: x-user-role
      value: "{{role}}"
    - name: x-request-id
      value: ""
      disabled: true
  body:
    type: json
    data: |-
      {
        "month": "2026-06"
      //   "branch_id": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

