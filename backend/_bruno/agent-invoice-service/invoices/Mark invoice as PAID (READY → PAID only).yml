info:
  name: Mark invoice as PAID (READY → PAID only)
  type: http
  seq: 5
  tags:
    - invoices

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/invoices/{{ivId}}/status"
  headers:
    - name: x-user-ou
      value: "{{ouId}}"
    - name: x-user-branch
      value: "{{branchId}}"
    - name: x-user-id
      value: "{{userId}}"
    - name: x-user-role
      value: "{{role}}"
    - name: x-request-id
      value: ""
      disabled: true
  body:
    type: json
    data: |-
      {
        "status": "PAID"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Status updated
    request:
      url: "{{baseUrl}}/api/v1/invoices/:id/status"
      method: PUT
      headers:
        - name: x-user-ou
