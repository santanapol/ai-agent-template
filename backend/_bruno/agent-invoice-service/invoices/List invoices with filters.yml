info:
  name: List invoices with filters
  type: http
  seq: 3
  tags:
    - invoices

http:
  method: GET
  url: "{{baseUrl}}/api/v1/invoices"
  headers:
    - name: x-user-ou
      value: "{{ouId}}"
    - name: x-user-branch
      value: "{{branchId}}"
    - name: x-user-id
      value: "{{userId}}"
    - name: x-user-role
      value: "{{role}}"
    - name: x-request-id
      value: ""
      disabled: true
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
    - name: iv_no
      value: ""
      type: query
      disabled: true
    - name: branch_id
      value: ""
      type: query
      disabled: true
    - name: billing_month
      value: ""
      type: query
      disabled: true
    - name: status
      value: PENDING
      type: query
      disabled: true
    - name: status
      value: VOID
      type: query
      disabled: true
    - name: status
      value: CAL
      type: query
      disabled: true
    - name: status
      value: MISSING_FEE
      type: query
      disabled: true
    - name: status
      value: READY
      type: query
      disabled: true
    - name: status
      value: ERROR
      type: query
      disabled: true
    - name: status
      value: PAID
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

