info:
  name: Calculate provider fees for an invoice
  type: http
  seq: 2
  tags:
    - invoices

http:
  method: POST
  url: "{{baseUrl}}/api/v1/invoices/calculate-fee"
  headers:
    - name: x-user-ou
      value: ""
    - name: x-user-branch
      value: ""
    - name: x-user-id
      value: ""
    - name: x-user-role
      value: ""
    - name: If-Match
      value: ""
      description: Weak ETag from previous GET or mutating response (e.g. W/"...")
    - name: x-request-id
      value: ""
      disabled: true
  body:
    type: json
    data: |-
      {
        "iv_id": "",
        "action": "CALCULATE"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

