info:
  name: Get invoice detail
  type: http
  seq: 6
  tags:
    - invoices

http:
  method: GET
  url: "{{baseUrl}}/api/v1/invoices/{{ivId}}"
  headers:
    - name: x-user-ou
      value: "{{ouId}}"
    - name: x-user-branch
      value: "{{branchId}}"
    - name: x-user-id
      value: "{{userId}}"
    - name: x-user-role
      value: "{{role}}"
    - name: x-request-id
      value: ""
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Invoice detail
    request:
      url: "{{baseUrl}}/api/v1/invoices/:id"
      method: GET
      headers:
        - name: x-user-ou
          value: ""
        - name: x-user-branch
          value: ""
        - name: x-user-id
          value: ""
        - name: x-user-role
          value: ""
        - name: x-request-id
          value: ""
          disabled: true
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
