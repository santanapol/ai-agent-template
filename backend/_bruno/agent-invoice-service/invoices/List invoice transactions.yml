info:
  name: List invoice transactions
  type: http
  seq: 4
  tags:
    - invoices

http:
  method: GET
  url: "{{baseUrl}}/api/v1/invoices/{{ivId}}/transactions"
  headers:
    - name: x-user-ou
      value: "{{ouId}}"
    - name: x-user-branch
      value: "{{branchId}}"
    - name: x-user-id
      value: "{{userId}}"
    - name: x-user-role
      value: "{{role}}"
    - name: x-request-id
      value: ""
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Transaction list
    request:
      url: "{{baseUrl}}/api/v1/invoices/:id/transactions"
