info:
  name: Readiness probe
  type: http
  seq: 2
  tags:
    - system

http:
  method: GET
  url: "{{baseUrl}}/readyz"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Service and dependencies are ready
    request:
      url: "{{baseUrl}}/readyz"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "",
            "dependencies": [
              {
                "name": "",
                "status": ""
              }
            ]
          }
  - name: 503 Response
    description: Service unavailable
    request:
      url: "{{baseUrl}}/readyz"
      method: GET
    response:
      status: 503
      statusText: Service Unavailable
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "code": "RESOURCE_NOT_FOUND",
            "message": "",
            "data": "",
            "requestId": ""
          }

docs: Verifies primary, invoice, and read MongoDB connections are reachable.
