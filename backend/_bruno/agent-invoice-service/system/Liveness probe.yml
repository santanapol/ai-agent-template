info:
  name: Liveness probe
  type: http
  seq: 1
  tags:
    - system

http:
  method: GET
  url: "{{baseUrl}}/healthz"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Process is alive
    request:
      url: "{{baseUrl}}/healthz"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "ok",
            "timestamp": "",
            "uptime": 0
          }
