info:
  name: List fee overrides for an agent
  type: http
  seq: 1
  tags:
    - agent-fees

http:
  method: GET
  url: "{{baseUrl}}/api/v1/agents/:agentId/fees"
  headers:
    - name: x-user-ou
      value: ""
    - name: x-user-branch
      value: ""
    - name: x-user-id
      value: ""
    - name: x-user-role
      value: ""
    - name: x-request-id
      value: ""
      disabled: true
  params:
    - name: agentId
      value: ""
      type: path
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v1/agents/:agentId/fees"
      method: GET
      headers:
        - name: x-user-ou
          value: ""
        - name: x-user-branch
          value: ""
        - name: x-user-id
          value: ""
        - name: x-user-role
          value: ""
        - name: x-request-id
          value: ""
          disabled: true
      params:
        - name: agentId
          value: ""
          type: path
        - name: page
          value: "1"
          type: query
        - name: limit
          value: "20"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "code": "SUCCESS",
            "message": "",
            "data": [
              {
                "_id": "",
                "agent_id": "",
                "ou_id": "",
                "branch_id": "",
                "company_id": "",
                "main_cate_id": "",
                "platform_name": "",
                "game_provider": "",
                "game_category": "",
                "fee_rate": 0,
                "cr_by": "",
                "cr_date": "",
                "cr_prog": "",
                "upd_by": "",
                "upd_date": "",
                "upd_prog": ""
              }
            ],
            "pagination": {
              "page": 0,
              "limit": 0,
              "total": 0
            }
          }
  - name: 401 Response
    description: Authentication failed
    request:
      url: "{{baseUrl}}/api/v1/agents/:agentId/fees"
      method: GET
      headers:
        - name: x-user-ou
          value: ""
        - name: x-user-branch
          value: ""
        - name: x-user-id
          value: ""
        - name: x-user-role
          value: ""
        - name: x-request-id
          value: ""
          disabled: true
      params:
        - name: agentId
          value: ""
          type: path
        - name: page
          value: "1"
          type: query
        - name: limit
          value: "20"
          type: query
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "code": "RESOURCE_NOT_FOUND",
            "message": "",
            "data": "",
            "requestId": ""
          }
