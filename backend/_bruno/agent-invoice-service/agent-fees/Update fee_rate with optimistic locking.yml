info:
  name: Update fee_rate with optimistic locking
  type: http
  seq: 3
  tags:
    - agent-fees

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/agents/:agentId/fees/:feeId"
  headers:
    - name: x-user-ou
      value: ""
    - name: x-user-branch
      value: ""
    - name: x-user-id
      value: ""
    - name: x-user-role
      value: ""
    - name: If-Match
      value: ""
      description: Weak ETag from previous GET or mutating response (e.g. W/"...")
    - name: x-request-id
      value: ""
      disabled: true
  params:
    - name: agentId
      value: ""
      type: path
    - name: feeId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "fee_rate": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

