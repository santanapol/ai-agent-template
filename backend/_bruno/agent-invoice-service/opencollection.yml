opencollection: 1.0.0

info:
  name: agent-invoice-service
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: apikey
    key: x-gateway-secret
    value: "{{apiKey}}"
    placement: header
  variables:
    - name: apiKey
      value: 8f7D2aE1b9C0e3F4a5B6c7D8e9F0a1B2
    - name: baseUrl
      value: http://localhost:3000
    - name: ouId
      value: 5f4f9d57266ed249e45ecef5
    - name: branchId
      value: 6a2266bfdc372ec6e8ced94e
    - name: userId
      value: 6a2266bfdc372ec6e8ced94f
    - name: role
      value: branch_admin
    - name: ivId
      value: 6a227c777694fb7f673e9ab3
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
