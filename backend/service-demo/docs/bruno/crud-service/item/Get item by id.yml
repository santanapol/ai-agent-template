info:
  name: Get item by id
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/items/:itemId"
  headers:
    - name: x-user-id
      value: 69e988b8e9e5870b957e51ee
    - name: x-user-ou
      value: 69e988b8e9e5870b957e51ec
    - name: x-user-branch
      value: 69e988b8e9e5870b957e51ed
    - name: x-gateway-secret
      value: "{{apiKey}}"
  params:
    - name: itemId
      value: 69ef1eca5d74fd8e63372d28
      type: path
      description: Item id (opaque string).
  auth:
    type: apikey
    key: x-gateway-secret
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

