openapi: 3.1.0
info:
  title: auth
  version: 0.1.6
  description: |
    Edge identity API (login, refresh, logout), password change (`POST /auth/me/password`),
    internal user provisioning and password reset for trusted services, session revoke, and JWKS.

    All **POST /auth/** requests require header **Content-Type: application/json** (or the same with `charset=utf-8`), including cookie-only flows (use body `{}` if needed).

    This API does **not** expose public signup/invite endpoints; user provisioning is admin-managed via internal branch-scoped member APIs.

    Responses use RFC 7807 Problem Details (`application/problem+json`) with required `code` aligned to `_coding-standards/auth/codes.yaml`. Readiness uses **GET /readyz** (Mongo ping).
  contact:
    name: engineering
    email: engineering@example.invalid
    url: https://example.invalid/auth
  license:
    name: LicenseRef-Proprietary
    url: https://example.invalid/license

servers:
  - url: http://127.0.0.1:{port}
    description: Local
    variables:
      port:
        default: '3001'
        description: Listen port (`PORT` env)

security: []

tags:
  - name: auth
    description: Login and token lifecycle
  - name: discovery
    description: JWKS and metadata
  - name: health
    description: Liveness and readiness
  - name: internal
    description: Trusted service-to-service APIs (O-15 — not public internet)
  - name: admin
    description: Dynamic permissions admin APIs

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness
      description: |
        **Purpose:** Cheap process check for orchestrators, load balancers, and k8s-style probes.

        **Behaviour:** Returns JSON with `status`, `timestamp`, and process `uptime` in seconds. Does **not** open MongoDB or call upstream services — a passing `200` only means the Node process accepted the connection.

        **Auth:** None. No `Authorization` or cookie required.

        **Client hints:** Use `GET /readyz` when you need dependency health (MongoDB). Wrong HTTP method or unknown path may yield `404` (Fastify default).
      operationId: getHealthz
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptJson'
      responses:
        '200':
          description: |
            Liveness OK — JSON includes `status`, ISO `timestamp`, and process `uptime` seconds.
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp, uptime]
                properties:
                  status:
                    type: string
                    description: Always `ok` when the process responds.
                  timestamp:
                    type: string
                    format: date-time
                    description: ISO-8601 UTC timestamp from the service clock.
                  uptime:
                    type: integer
                    minimum: 0
                    description: Process uptime in seconds.
              examples:
                ok:
                  summary: Liveness payload
                  value:
                    status: ok
                    timestamp: '2026-04-16T12:00:00.000Z'
                    uptime: 42
  /readyz:
    get:
      tags: [health]
      summary: Readiness
      description: |
        **Purpose:** Readiness probe before sending user traffic — verifies critical dependencies (at minimum MongoDB connectivity for this service).

        **Behaviour:** On success, returns JSON with `status` and a `dependencies` array (name + status per probed dependency). Probes at least **MongoDB**; when **`REDIS_URL`** is configured, also **`PING`** Redis and include a `redis` dependency entry. If any probe fails, returns **`503`** with **`application/problem+json`** (`Problem` schema) and required registry `code` (e.g. `AUTH_NOT_READY`).

        **Auth:** None.
      operationId: getReadyz
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptJson'
      responses:
        '200':
          description: |
            Readiness OK — JSON lists probed dependencies (e.g. MongoDB) with per-entry status.
          content:
            application/json:
              schema:
                type: object
                required: [status, dependencies]
                properties:
                  status:
                    type: string
                    description: Typically `ok` when all probed dependencies pass.
                  dependencies:
                    type: array
                    description: One entry per dependency (e.g. MongoDB).
                    items:
                      type: object
                      required: [name, status]
                      properties:
                        name:
                          type: string
                        status:
                          type: string
              examples:
                ready:
                  summary: Mongo + Redis reachable
                  value:
                    status: ok
                    dependencies:
                      - name: mongodb
                        status: ok
                      - name: redis
                        status: ok
        '503':
          description: |
            At least one readiness dependency failed (e.g. MongoDB unreachable). RFC 7807 problem body with required `code`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                degraded:
                  value:
                    type: https://example.invalid/auth/problems/not-ready
                    title: Service Unavailable
                    status: 503
                    detail: Readiness check failed.
                    code: AUTH_NOT_READY
  /.well-known/jwks.json:
    get:
      tags: [discovery]
      summary: JWKS document
      description: |
        **Purpose:** Publish the **public** JSON Web Key Set (RFC 7517) used to verify **RS256** access JWTs minted by this service.

        **Consumers:** Primarily **gateway** (`JWT_JWKS_URL` must match this document’s URL), and optionally other verifiers. Align `JWKS_PUBLIC_URL` in auth env with the URL gateway fetches.

        **Response:** `200` + `application/json` body with `keys[]` (RSA public JWKs). Implementations may send **`Cache-Control`**; gateways should refresh when encountering an unknown `kid` (key rotation).

        **Auth:** None. Path is fixed per SoT — do not rely on query parameters for behaviour.

        **Errors:** Wrong method or path typically `404` (Fastify); rare internal failures `500` (Fastify JSON error shape — not RFC 7807).
      operationId: getJwks
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptJson'
      responses:
        '200':
          description: |
            JWKS document — JSON with `keys` array of public JWKs for RS256 verification (`kid` aligns with JWT header).
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    description: JWK Set members used to verify RS256 access JWTs (`kid` matches JWT header).
                    items:
                      type: object
                      description: Public JWK (RFC 7517) — shape varies by key material.
              examples:
                minimal:
                  summary: Single RSA signing key (placeholder values)
                  value:
                    keys:
                      - kty: RSA
                        use: sig
                        kid: default
                        alg: RS256
                        n: placeholder-modulus-base64url
                        e: AQAB
  /auth/login:
    post:
      tags: [auth]
      summary: Login
      description: |
        **Purpose:** Exchange **username + password** (over TLS in production) for a new **access JWT** (RS256) and a **refresh** channel (opaque token and/or HttpOnly cookie) per SoT ([`docs/architecture.md`](./docs/architecture.md)).

        **Request:** JSON body — **`Content-Type: application/json` is required** on every call (see parameters). Values such as `application/json; charset=utf-8` are accepted. You do not need **`Accept`**; responses are JSON or `application/problem+json` by status.
        - **`client_kind: native`** — expect `refresh_token` in the **JSON** body on `200` when the server returns it.
        - **`client_kind: web`** — refresh is issued as an **HttpOnly** cookie; success JSON typically **omits** `refresh_token`.

        **Success (`200`):** JSON with `access_token`, `token_type: Bearer`, `expires_in` (seconds). May include **`Set-Cookie`** for web flows. No outer envelope.

        **Errors (RFC 7807 `application/problem+json`):** `400` validation; `401` invalid credentials (same envelope when user is unknown — anti-enumeration); `423` account locked where applicable; `429` throttling / rate limits — **branch on `type` URI**, not only HTTP status.

        **Security:** Never send `password` in query strings. Do not log passwords, full refresh values, or full JWTs at info level.
      operationId: login
      security: []
      x-ratelimit:
        windowMs: 60000
        max: 30
      parameters:
        - $ref: '#/components/parameters/ContentTypeApplicationJson'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: demo
              password: '<password-placeholder>'
              client_kind: native
            examples:
              default:
                summary: Default body for client import (Bruno / Postman)
                value:
                  username: demo
                  password: '<password-placeholder>'
                  client_kind: native
      responses:
        '200':
          description: |
            Login succeeded — access JWT and metadata; native may include `refresh_token` in JSON; web may rely on `Set-Cookie` for refresh.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccess'
              examples:
                nativeWithRefresh:
                  summary: Native — refresh token in JSON body
                  value:
                    access_token: '<access-jwt-placeholder>'
                    token_type: Bearer
                    expires_in: 900
                    permissions: ['profiles:*', 'invoice:read']
                    refresh_token: '<opaque-refresh-placeholder>'
                browserNoRefreshField:
                  summary: Browser — refresh only in HttpOnly cookie (no `refresh_token` field)
                  value:
                    access_token: '<access-jwt-placeholder>'
                    token_type: Bearer
                    expires_in: 900
                    permissions: ['profiles:*', 'invoice:read']
        '400':
          description: |
            Request validation failed (JSON shape, missing fields, invalid `client_kind`, etc.). RFC 7807 problem body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidRequest:
                  value:
                    type: https://example.invalid/auth/problems/invalid-request
                    title: Bad Request
                    status: 400
                    detail: Request validation failed.
                    code: AUTH_INVALID_REQUEST
        '401':
          description: |
            Authentication failed — wrong password or unknown user (same problem envelope to avoid user enumeration).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidCredentials:
                  value:
                    type: https://example.invalid/auth/problems/invalid-credentials
                    title: Unauthorized
                    status: 401
                    detail: Invalid username or password.
                    code: LOGIN_INVALID_CREDENTIALS
        '423':
          description: |
            Account temporarily locked or forbidden login state per SoT. RFC 7807 problem body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                accountLocked:
                  value:
                    type: https://example.invalid/auth/problems/account-locked
                    title: Locked
                    status: 423
                    detail: This account is temporarily locked.
                    code: LOGIN_ACCOUNT_LOCKED
        '429':
          description: |
            Too many requests — credential throttle or API rate limit; use `type` URI to disambiguate.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                tooManyAttempts:
                  value:
                    type: https://example.invalid/auth/problems/too-many-attempts
                    title: Too Many Requests
                    status: 429
                    detail: Too many login attempts. Please try again later.
                    code: AUTH_TOO_MANY_ATTEMPTS
  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh token
      description: |
        **Purpose:** Rotate the session — validate the current opaque refresh, issue a **new access JWT**, and (for native) a **new opaque refresh**; browser clients may receive a rotated refresh via **`Set-Cookie`**.

        **Refresh source (priority):** (1) HttpOnly cookie named by env (default `refresh_token`) when present; (2) JSON field `refresh_token` for native clients when not using the cookie channel.

        **Request body:** Optional. Native clients should send `{"refresh_token":"<opaque>"}` when not relying on the cookie. Browser clients should still send **`Content-Type: application/json`** and may use body `{}` when using cookie-only refresh.

        **Headers:** **`Content-Type: application/json` required** (same as other `POST /auth/*`). Optional `Cookie` (see `CookieRefresh`). No `Accept` required.

        **Success (`200`):** Same token shape as login (`RefreshSuccess`). Native responses may include `refresh_token`; browser responses may omit it from JSON when rotation is cookie-only.

        **Errors:** `400` malformed body; `401` invalid, expired, missing, or **reused** refresh (distinguish via **`type`** in problem body — includes reuse / family revocation per SoT); `429` throttles.

        **Auth:** No Bearer JWT on this route.
      operationId: refreshToken
      security: []
      x-ratelimit:
        windowMs: 60000
        max: 120
      parameters:
        - $ref: '#/components/parameters/ContentTypeApplicationJson'
        - $ref: '#/components/parameters/CookieRefresh'
      requestBody:
        required: false
        description: |
          **Native:** send `refresh_token` in JSON when not using the HttpOnly cookie.
          **Browser:** send **`Content-Type: application/json`**; body may be `{}` or omitted per client — refresh is read from the `refresh_token` cookie set at login when present.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: '<opaque-refresh-placeholder>'
            examples:
              default:
                summary: Default native refresh body (import)
                value:
                  refresh_token: '<opaque-refresh-placeholder>'
              native:
                summary: Native client sends opaque refresh
                value:
                  refresh_token: '<opaque-refresh-placeholder>'
              emptyBrowser:
                summary: Browser — empty object when cookie carries refresh
                value: {}
      responses:
        '200':
          description: |
            Refresh/rotation succeeded — new access JWT; native may receive new opaque `refresh_token` in JSON; browser may get cookie rotation (`Set-Cookie`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshSuccess'
              examples:
                rotatedNative:
                  summary: Native — new access + rotated refresh in body
                  value:
                    access_token: '<access-jwt-placeholder>'
                    token_type: Bearer
                    expires_in: 900
                    permissions: ['profiles:*', 'invoice:read']
                    refresh_token: '<new-opaque-refresh-placeholder>'
                browserNoRefreshBody:
                  summary: Browser — access only; new refresh in Set-Cookie (not modeled here)
                  value:
                    access_token: '<access-jwt-placeholder>'
                    token_type: Bearer
                    expires_in: 900
                    permissions: ['profiles:*', 'invoice:read']
        '400':
          description: |
            Malformed or invalid refresh request body when present. RFC 7807 problem body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidRequest:
                  value:
                    type: https://example.invalid/auth/problems/invalid-request
                    title: Bad Request
                    status: 400
                    detail: Request validation failed.
                    code: AUTH_INVALID_REQUEST
        '401':
          description: |
            Refresh rejected — missing/invalid/expired token, or reuse/family revocation; distinguish using **`type`** on the problem document.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                refreshRejected:
                  value:
                    type: https://example.invalid/auth/problems/refresh-rejected
                    title: Unauthorized
                    status: 401
                    detail: Refresh token is invalid or expired.
                    code: TOKEN_REFRESH_REJECTED
        '429':
          description: |
            Too many requests — rate limit or throttle; use `type` URI on the problem body to classify.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                tooManyAttempts:
                  value:
                    type: https://example.invalid/auth/problems/too-many-attempts
                    title: Too Many Requests
                    status: 429
                    detail: Too many authentication attempts, please try again later.
                    code: AUTH_TOO_MANY_ATTEMPTS
  /auth/logout:
    post:
      tags: [auth]
      summary: Logout
      description: |
        **Purpose:** End the refresh **family** for the presented refresh token — revokes active refresh tokens tied to that family (SoT logout semantics).

        **Token source:** Same as refresh — cookie channel and/or JSON `refresh_token` for native. **`Content-Type: application/json` required** on every `POST` (use body `{}` for cookie-only logout if your client omits an empty body).

        **Success (`204`):** **No response body.** Client should discard cached access JWTs and stop using the old refresh. Response may clear the refresh cookie (implementation-specific `Set-Cookie`).

        **Idempotency:** Missing or already-revoked refresh still yields **`204`** where implemented (do not infer session existence from status alone).

        **Errors:** `400` validation; `429` throttles. Problem details use `application/problem+json` when returned.

        **Auth:** No Bearer JWT on this route.
      operationId: logout
      security: []
      x-ratelimit:
        windowMs: 60000
        max: 60
      parameters:
        - $ref: '#/components/parameters/ContentTypeApplicationJson'
        - $ref: '#/components/parameters/CookieRefresh'
      requestBody:
        required: false
        description: |
          **Native:** optional `refresh_token` in JSON.
          **Browser:** send **`Content-Type: application/json`**; use `{}` or omit body per client — refresh is revoked from cookie when present.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            example:
              refresh_token: '<opaque-refresh-placeholder>'
            examples:
              default:
                summary: Default native logout body (import)
                value:
                  refresh_token: '<opaque-refresh-placeholder>'
              native:
                summary: Native — revoke by opaque refresh in body
                value:
                  refresh_token: '<opaque-refresh-placeholder>'
              empty:
                summary: Browser or idempotent logout without body
                value: {}
      responses:
        '204':
          description: |
            Logout accepted — **no JSON body**. Client should clear local tokens; server may clear refresh cookie.
        '400':
          description: |
            Malformed optional body when sent. RFC 7807 problem body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidRequest:
                  value:
                    type: https://example.invalid/auth/problems/invalid-request
                    title: Bad Request
                    status: 400
                    detail: Request validation failed.
                    code: AUTH_INVALID_REQUEST
        '429':
          description: |
            Too many requests — rate limit or throttle; use `type` URI on the problem body to classify.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                tooManyAttempts:
                  value:
                    type: https://example.invalid/auth/problems/too-many-attempts
                    title: Too Many Requests
                    status: 429
                    detail: Too many authentication attempts, please try again later.
                    code: AUTH_TOO_MANY_ATTEMPTS
  /auth/me/password:
    post:
      tags: [auth]
      summary: Change own password
      description: |
        Authenticated user changes password. Requires `current_password` and `new_password` (min 16).
        On success: bump `access_token_gen`, revoke refresh — client should sign in again.
        See [`docs/design-password-management.md`](./docs/design-password-management.md).
      operationId: changeOwnPassword
      security:
        - BearerAccess: []
      x-ratelimit:
        windowMs: 60000
        max: 10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOwnPasswordRequest'
      parameters:
        - $ref: '#/components/parameters/ContentTypeApplicationJson'
      responses:
        '204':
          description: Password updated; sessions invalidated.
        '400':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing/invalid Bearer or wrong current password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limit exceeded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/me/menus:
    get:
      tags: [auth]
      summary: Get my permitted menu structure
      description: |
        Returns the menu nodes the authenticated user is permitted to see, as a **flat list**
        ordered by (depth, `sort_order`). Permissions are resolved fresh from the database
        (not from the JWT claim), wildcards are expanded against the central menu registry,
        and ancestor `menu` nodes are included up to the root so the client can assemble the tree
        from `parent_key`. Only nodes relevant to the caller are returned.
      operationId: getMyMenus
      security:
        - BearerAccess: []
      x-ratelimit:
        windowMs: 60000
        max: 60
      responses:
        '200':
          description: Permitted menu nodes (may be empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyMenusSuccess'
              examples:
                granted:
                  summary: User holding `profiles:*`
                  value:
                    menus:
                      - {
                          key: staff,
                          label: 'จัดการพนักงาน',
                          type: menu,
                          parent_key: null,
                          sort_order: 10
                        }
                      - {
                          key: 'staff:profiles',
                          label: 'โปรไฟล์พนักงาน',
                          type: menu,
                          parent_key: staff,
                          sort_order: 10
                        }
                      - {
                          key: 'profiles:list',
                          label: 'รายชื่อพนักงาน',
                          type: action,
                          parent_key: 'staff:profiles',
                          sort_order: 10
                        }
        '401':
          description: Missing/invalid Bearer or stale `token_gen`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limit exceeded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/admin/menus:
    get:
      tags: [admin]
      summary: Get all menu nodes
      description: Returns all menu/action nodes in the system without filtering.
      operationId: getAdminMenus
      security:
        - BearerAccess: []
      responses:
        '200':
          description: List of all menu nodes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  menus:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuNode'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags: [admin]
      summary: Create a menu/action node
      description: Create a new menu node in the registry, validating hierarchy rules.
      operationId: createAdminMenu
      security:
        - BearerAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMenuRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuNode'
        '400':
          description: Validation failed (RFC 7807 problem)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/admin/menus/{key}:
    patch:
      tags: [admin]
      summary: Update a menu node
      description: Modify labels or parent of a menu node. key and type cannot be modified.
      operationId: updateAdminMenu
      security:
        - BearerAccess: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMenuRequest'
      responses:
        '200':
          description: Updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuNode'
        '400':
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: Precondition Failed (ETag/If-Match mismatch)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [admin]
      summary: Delete a menu node
      description: Remove a menu node if it has no children and is not referenced in role mappings.
      operationId: deleteAdminMenu
      security:
        - BearerAccess: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted successfully
        '409':
          description: Conflict (has children or referenced)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: Precondition Failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/admin/role-permissions:
    get:
      tags: [admin]
      summary: Get all role permission mappings
      description: Query permission mapping registries.
      operationId: getAdminRolePermissions
      security:
        - BearerAccess: []
      parameters:
        - name: ou_id
          in: query
          required: false
          schema:
            type: string
        - name: role
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Mappings retrieved
  /auth/admin/role-permissions/{ou_id}/{role}:
    put:
      tags: [admin]
      summary: Upsert role permission mapping
      description: Save permission mapping for (ou_id, role) pair. Supports revoking sessions.
      operationId: upsertAdminRolePermission
      security:
        - BearerAccess: []
      parameters:
        - name: ou_id
          in: path
          required: true
          schema:
            type: string
        - name: role
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertRolePermissionRequest'
      responses:
        '200':
          description: Upserted successfully
        '400':
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [admin]
      summary: Delete role permission mapping
      description: Clear mapping override for (ou_id, role) pair.
      operationId: deleteAdminRolePermission
      security:
        - BearerAccess: []
      parameters:
        - name: ou_id
          in: path
          required: true
          schema:
            type: string
        - name: role
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Mapping cleared
  /internal/users:
    post:
      tags: [internal]
      summary: Provision user (staff caller)
      description: |
        Create `auth_users` for staff profile provisioning. **Implemented** — OpenAPI resync 2026-05-26.
      operationId: createInternalUser
      security:
        - InternalServiceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalCreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalCreateUserResponse'
        '400':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Internal service authentication failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Username already exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /internal/users/{user_id}/password:
    post:
      tags: [internal]
      summary: Set user password (service)
      description: |
        Trusted caller (staff) sets a new password without knowing the old one.
      operationId: setUserPasswordInternal
      security:
        - InternalServiceBearer: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalSetPasswordRequest'
      responses:
        '204':
          description: Password updated.
        '400':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Internal service authentication failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: User not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /internal/users/{user_id}/sessions/revoke:
    post:
      tags: [internal]
      summary: Revoke user sessions
      description: |
        **Purpose:** Trusted caller (e.g. staff after profile archive) revokes all active refresh sessions for `user_id` and bumps `access_token_gen` so gateway can reject stale access JWTs via `token_gen` claim (O-16).

        **Auth:** `Authorization: Bearer <AUTH_INTERNAL_SERVICE_SECRET>` — constant-time verification; separate from gateway mesh secret.

        **Idempotency:** Repeat calls with the same existing `user_id` return **200**; `revoked_refresh_tokens` may be **0** when no active refresh rows remain; **`access_token_gen` still increments on every successful call** (by design). Unknown `user_id` → **404** (`AUTH_USER_NOT_FOUND`). When **`REDIS_URL`** is set, Redis publish failure after DB bump → **503** (`AUTH_NOT_READY`, fail-closed).

        **Network:** Must not be exposed on public internet without private network / mTLS controls (O-15).
      operationId: revokeUserSessions
      security:
        - InternalServiceBearer: []
      x-ratelimit:
        windowMs: 60000
        max: 60
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/ContentTypeApplicationJson'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalRevokeSessionsRequest'
            examples:
              withReason:
                summary: Staff archive follow-up
                value:
                  reason: staff.profile_archive
                  correlation_id: corr-01HX-example
              empty:
                summary: Idempotent retry
                value: {}
      responses:
        '200':
          description: Sessions revoked (or none remaining) and generation bumped when user exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalRevokeSessionsSuccess'
              examples:
                revoked:
                  value:
                    revoked_refresh_tokens: 2
                    access_token_gen: 1
                idempotent:
                  value:
                    revoked_refresh_tokens: 0
                    access_token_gen: 2
        '400':
          description: Invalid `user_id` path parameter (not 24-hex ObjectId).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidRequest:
                  value:
                    type: https://example.invalid/auth/problems/invalid-request
                    title: Bad Request
                    status: 400
                    detail: Request validation failed.
                    code: AUTH_INVALID_REQUEST
        '404':
          description: Valid ObjectId path but no matching user.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                userNotFound:
                  value:
                    type: https://example.invalid/auth/problems/user-not-found
                    title: Not Found
                    status: 404
                    detail: User not found.
                    code: AUTH_USER_NOT_FOUND
        '401':
          description: Missing or invalid internal service Bearer secret.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                internalUnauthorized:
                  value:
                    type: https://example.invalid/auth/problems/internal-unauthorized
                    title: Unauthorized
                    status: 401
                    detail: Internal service authentication failed.
                    code: AUTH_INTERNAL_UNAUTHORIZED
        '429':
          description: Internal route rate limit exceeded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                tooManyAttempts:
                  value:
                    type: https://example.invalid/auth/problems/too-many-attempts
                    title: Too Many Requests
                    status: 429
                    detail: Too many authentication attempts, please try again later.
                    code: AUTH_TOO_MANY_ATTEMPTS
        '503':
          description: Dependency failure (e.g. Redis publish after revoke when `REDIS_URL` is set).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notReady:
                  value:
                    type: https://example.invalid/auth/problems/not-ready
                    title: Service Unavailable
                    status: 503
                    detail: Unable to publish access token generation to Redis.
                    code: AUTH_NOT_READY
  /internal/users/{user_id}/role:
    patch:
      tags: [internal]
      summary: Set user role (service)
      description: |
        Trusted caller (staff) sets a new role for a user and optionally revokes sessions.
      operationId: setUserRoleInternal
      security:
        - InternalServiceBearer: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalSetRoleRequest'
      responses:
        '204':
          description: Role updated.
        '400':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Internal service authentication failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: User not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    BearerAccess:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT from login/refresh (gateway verifies on upstream; auth validates on this route when implemented).
    InternalServiceBearer:
      type: http
      scheme: bearer
      description: Shared secret from `AUTH_INTERNAL_SERVICE_SECRET` (service-to-service only).
  parameters:
    AcceptJson:
      name: Accept
      in: header
      required: false
      description: |
        Optional; JSON responses use `application/json` where applicable.

        Used on **GET** (`/healthz`, `/readyz`, `/.well-known/jwks.json`). Success prefers `application/json`; errors may be `application/problem+json` (RFC 7807).

        **POST `/auth/*`:** use **`#/components/parameters/ContentTypeApplicationJson`** (required) — not this parameter.
      schema:
        type: string
      example: application/json

    ContentTypeApplicationJson:
      name: Content-Type
      in: header
      required: true
      description: |
        **Required on every `POST /auth/login`, `POST /auth/refresh`, and `POST /auth/logout`.** Identifies the request entity as JSON (RFC 7231). Use `application/json` or `application/json; charset=utf-8` (case-insensitive parameter names are fine).

        Cookie-only browser flows must still send this header; use a JSON body of `{}` if the client cannot send `Content-Type` without a body.
      schema:
        type: string
        pattern: '^[Aa]pplication/[Jj]son(;\\s*charset=[^;\\s]+)?$'
      example: application/json

    CookieRefresh:
      name: Cookie
      in: header
      required: false
      description: Browser flow — `refresh_token=<opaque>` when using HttpOnly cookie channel (cookie name from env; default `refresh_token`).
      schema:
        type: string
      example: refresh_token=<opaque-refresh-placeholder>

    UserIdPath:
      name: user_id
      in: path
      required: true
      description: MongoDB ObjectId as 24-character lowercase/uppercase hex string.
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
      example: 507f1f77bcf86cd799439011

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Registry code from auth/codes.yaml only
          enum:
            - AUTH_INVALID_REQUEST
            - LOGIN_INVALID_CREDENTIALS
            - TOKEN_REFRESH_REJECTED
            - LOGIN_ACCOUNT_LOCKED
            - AUTH_TOO_MANY_ATTEMPTS
            - AUTH_NOT_READY
            - AUTH_INTERNAL_UNAUTHORIZED
            - AUTH_USER_NOT_FOUND
            - AUTH_USER_ALREADY_EXISTS
            - AUTH_PASSWORD_UNCHANGED
            - AUTH_PASSWORD_POLICY_VIOLATION
    ChangeOwnPasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 256
        new_password:
          type: string
          minLength: 8
          maxLength: 256
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[^A-Za-z0-9]).+$'
    InternalCreateUserRequest:
      type: object
      additionalProperties: false
      required: [ou_id, branch_id, username, password]
      properties:
        ou_id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        branch_id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        username:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          minLength: 8
          maxLength: 256
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[^A-Za-z0-9]).+$'
        role:
          type: string
          default: staff
    InternalCreateUserResponse:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
    InternalSetPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 256
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[^A-Za-z0-9]).+$'
        revoke_sessions:
          type: boolean
          default: true
        reason:
          type: string
          maxLength: 256
        correlation_id:
          type: string
          maxLength: 128
    InternalRevokeSessionsRequest:
      type: object
      description: Optional metadata for audit and idempotent retries from trusted callers.
      properties:
        reason:
          type: string
          maxLength: 256
          description: Caller-specific reason code (e.g. `staff.profile_archive`).
        correlation_id:
          type: string
          maxLength: 128
          description: Correlation id for audit / retry (may differ from Fastify request id).
    InternalRevokeSessionsSuccess:
      type: object
      required: [revoked_refresh_tokens, access_token_gen]
      properties:
        revoked_refresh_tokens:
          type: integer
          minimum: 0
          description: Refresh token rows set `revoked_at` in this call.
        access_token_gen:
          type: integer
          minimum: 0
          description: User generation counter after `$inc` (0 when user not found).
    InternalSetRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [platform_admin, branch_admin, staff, support]
        revoke_sessions:
          type: boolean
          default: true
        correlation_id:
          type: string
          maxLength: 128
    LoginRequest:
      type: object
      description: Credential payload for `POST /auth/login` (TLS required in production).
      example:
        username: demo
        password: '<password-placeholder>'
        client_kind: native
      required: [username, password, client_kind]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
          description: Login identifier (normalized server-side per SoT).
        password:
          type: string
          minLength: 1
          maxLength: 4096
          format: password
          description: Plain password over TLS — never log at info level.
        client_kind:
          type: string
          enum: [native, web]
          description: |
            `native` — expect `refresh_token` in JSON on success.
            `web` — refresh issued as HttpOnly cookie (no `refresh_token` in body).
    LoginSuccess:
      type: object
      description: Successful login — O-05 style success (no outer envelope).
      required: [access_token, token_type, expires_in, permissions]
      properties:
        access_token:
          type: string
          description: RS256 JWT access token; send in the HTTP Authorization header as Bearer (gateway routes).
        permissions:
          type: array
          items:
            type: string
          description: |
            Effective permission entries for the user — raw values from role mapping:
            exact action keys (e.g. `profiles:create`) or `domain:*` wildcards, never expanded.
            Matching contract: exact equality, or `domain:*` covers any `domain:<action>`.
        refresh_token:
          type: string
          description: Opaque refresh token in JSON only for native client_kind (omitted for web cookie flow).
        token_type:
          type: string
          enum: [Bearer]
          description: OAuth 2.0 token type (RFC 6750).
        expires_in:
          type: integer
          minimum: 1
          description: Access token lifetime in seconds.
    RefreshRequest:
      type: object
      description: Optional body for refresh when not using cookie channel.
      example:
        refresh_token: '<opaque-refresh-placeholder>'
      properties:
        refresh_token:
          type: string
          minLength: 10
          maxLength: 512
          description: Opaque refresh from prior login/refresh (native).
    RefreshSuccess:
      type: object
      description: Successful rotation — same shape as login success.
      required: [access_token, token_type, expires_in, permissions]
      properties:
        access_token:
          type: string
        permissions:
          type: array
          items:
            type: string
          description: |
            Effective permission entries for the user — raw values from role mapping:
            exact action keys (e.g. `profiles:create`) or `domain:*` wildcards, never expanded.
            Matching contract: exact equality, or `domain:*` covers any `domain:<action>`.
        refresh_token:
          type: string
          description: New opaque refresh for native channel when returned in body.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          minimum: 1
    MyMenusSuccess:
      type: object
      description: Flat list of permitted menu nodes — client assembles the tree from `parent_key`.
      required: [menus]
      properties:
        menus:
          type: array
          items:
            type: object
            required: [key, label, type, parent_key, sort_order]
            properties:
              key:
                type: string
                description: Permanent identifier (`domain:action` for actions). Never renamed.
              label:
                type: string
                description: Display label for the UI.
              type:
                type: string
                enum: [menu, action]
                description: '`menu` = structural node, `action` = permission leaf.'
              parent_key:
                type: string
                nullable: true
                description: Key of the parent node (`null` = root). Max depth 3.
              sort_order:
                type: integer
                description: Ordering within the same level (ascending).
    LogoutRequest:
      type: object
      description: Optional body for logout on native channel.
      example:
        refresh_token: '<opaque-refresh-placeholder>'
      properties:
        refresh_token:
          type: string
          minLength: 10
          maxLength: 512
          description: Opaque refresh to revoke (family-wide per SoT).
    MenuNode:
      type: object
      required: [key, label, type, parent_key, sort_order]
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [menu, action]
        parent_key:
          type: string
          nullable: true
        sort_order:
          type: integer
    CreateMenuRequest:
      type: object
      required: [key, label, type, parent_key, sort_order]
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [menu, action]
        parent_key:
          type: string
          nullable: true
        sort_order:
          type: integer
    UpdateMenuRequest:
      type: object
      properties:
        label:
          type: string
        parent_key:
          type: string
          nullable: true
        sort_order:
          type: integer
    UpsertRolePermissionRequest:
      type: object
      required: [menu_keys]
      properties:
        menu_keys:
          type: array
          items:
            type: string
        revoke_sessions:
          type: boolean
          default: false
