info:
  name: Login
  type: http
  seq: 1
  tags:
    - auth

http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "admin",
        "password": "1234",
        "client_kind": "native"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  **Purpose:** Exchange **username + password** (over TLS in production) for a new **access JWT** (RS256) and a **refresh** channel (opaque token and/or HttpOnly cookie) per SoT (`auth-login-design.md`).

  **Request:** JSON body — **`Content-Type: application/json` is required** on every call (see parameters). Values such as `application/json; charset=utf-8` are accepted. You do not need **`Accept`**; responses are JSON or `application/problem+json` by status.
  - **`client_kind: native`** — expect `refresh_token` in the **JSON** body on `200` when the server returns it.
  - **`client_kind: web`** — refresh is issued as an **HttpOnly** cookie; success JSON typically **omits** `refresh_token`.

  **Success (`200`):** JSON with `access_token`, `token_type: Bearer`, `expires_in` (seconds). May include **`Set-Cookie`** for web flows. No outer envelope.

  **Errors (RFC 7807 `application/problem+json`):** `400` validation; `401` invalid credentials (same envelope when user is unknown — anti-enumeration); `403` account locked where applicable; `429` throttling / rate limits — **branch on `type` URI**, not only HTTP status.

  **Security:** Never send `password` in query strings. Do not log passwords, full refresh values, or full JWTs at info level.
