info:
  name: Revoke user sessions
  type: http
  seq: 1
  tags:
    - internal

http:
  method: POST
  url: '{{baseUrl}}/internal/users/{{userId}}/sessions/revoke'
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{internalServiceSecret}}
  body:
    type: json
    data: |-
      {
        "reason": "bruno.manual_test",
        "correlation_id": "bruno-revoke-01"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  **Purpose:** Trusted caller revokes all active refresh sessions for `user_id` and bumps `access_token_gen` (O-16). When `REDIS_URL` is set, auth publishes `user:{sub}:token_gen` for gateway D3.

  **Auth:** `Authorization: Bearer` + `AUTH_INTERNAL_SERVICE_SECRET` (see environment `internalServiceSecret`) — **not** the user access JWT.

  **Path:** `userId` must be the user's MongoDB `_id` as 24-hex ObjectId — same as JWT **`sub`** from **Login** (`auth-service/auth/Login`). Copy `sub` into environment `userId`; do **not** use staff profile ids or other service ids (404 if mismatch).

  **Body:** Optional JSON (`reason`, `correlation_id`). `{}` or omit body for idempotent retries.

  **Success (`200`):** `{ "revoked_refresh_tokens": number, "access_token_gen": number }` — `access_token_gen` increments on every successful call even when `revoked_refresh_tokens` is `0`.

  **Errors (RFC 7807):** `400` invalid `user_id`; `401` `AUTH_INTERNAL_UNAUTHORIZED`; `404` `AUTH_USER_NOT_FOUND`; `503` `AUTH_NOT_READY` when Redis publish fails (fail-closed).

  **Local E2E:** Start Redis (`docker compose up -d redis`), set `REDIS_URL` on auth + gateway, call this, then hit gateway with an old access JWT — expect **401** when `token_gen` gate is active.
