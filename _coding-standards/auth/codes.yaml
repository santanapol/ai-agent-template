# Auth service codes
version: 1

codes:
  AUTH_INVALID_REQUEST:
    httpStatus: 400
    message: Request validation failed
    owner: auth

  LOGIN_INVALID_CREDENTIALS:
    httpStatus: 401
    message: Invalid username or password
    owner: auth

  TOKEN_REFRESH_REJECTED:
    httpStatus: 401
    message: Refresh token is invalid or expired
    owner: auth

  LOGIN_ACCOUNT_LOCKED:
    httpStatus: 423
    message: This account is temporarily locked
    owner: auth

  AUTH_TOO_MANY_ATTEMPTS:
    httpStatus: 429
    message: Too many authentication attempts, please try again later.
    owner: auth

  AUTH_NOT_READY:
    httpStatus: 503
    message: Auth service is not ready
    owner: auth

  TOKEN_REFRESH_INVALID:
    deprecated: true
    replacedBy: TOKEN_REFRESH_REJECTED
    httpStatus: 401
    message: Refresh token is invalid or expired
    owner: auth

  TOKEN_REFRESH_REUSED:
    deprecated: true
    replacedBy: TOKEN_REFRESH_REJECTED
    httpStatus: 401
    message: Refresh token is invalid or expired
    owner: auth
