openapi: 3.0.3
info:
  title: internal-api
  version: 0.1.1
  description: |
    **มุมมอง upstream (internal-api รับ request โดยตรงหลัง proxy หรือตอน dev)**

    รับ traffic ที่ผ่าน **gateway-service** แล้ว — ตรวจ **`x-gateway-secret`** (constant-time) ก่อนใช้ context จาก headers
    **`x-user-id`**, **`x-user-role`** (ตั้งโดย gateway จาก JWT — ห้ามไว้ใจค่าที่ client ส่งตรงเข้ามาโดยไม่ผ่าน gateway)

    ### มุมมอง client (ยิง gateway + Bearer)
    ใช้ไฟล์ **`openapi-via-gateway.yaml`** แยกต่างหาก — ลดการสับสนกับสัญญา upstream ในไฟล์นี้

    ### Normative sources (SoT)
    - **Header contract / gateway:** [`gateway-design.md`](../../gateway-service/gateway-design.md) section 4, 8
    - **ภาพรวม trust boundary:** [`gateway-architecture.md`](../../gateway-architecture.md)
    - **Response envelope:** `engineering-standards/active/backend/api/api-response-standard.md`
    - **Deploy — JWT / env คู่กัน (auth + gateway + secret):** [`deploy-jwt-env-checklist.md`](../../docs/deploy-jwt-env-checklist.md)

    ### Transport
    - **Production:** เรียกเฉพาะจาก private network ที่อนุญาตเฉพาะ gateway; ใช้ **TLS** ตาม baseline ใน `gateway-architecture.md`
    - **Logging:** ห้าม log ค่า `x-gateway-secret`

  license:
    name: LicenseRef-Proprietary
    url: https://example.invalid/license

externalDocs:
  description: Gateway header contract & internal normative rules
  url: ../../gateway-service/gateway-design.md

servers:
  - url: http://127.0.0.1:{port}
    description: |
      **ตรงเข้า internal-api** (`PORT` env) — dev / เครื่องมือ; ต้องส่ง `x-gateway-secret` ตาม operation
    variables:
      port:
        default: '4010'
        description: Listen port (`PORT` env)

tags:
  - name: Health
    description: Liveness — **ไม่** ตรวจ `x-gateway-secret`
  - name: Identity
    description: |
      Context ผู้ใช้จาก headers ที่ gateway inject — ต้องผ่าน `x-gateway-secret` ก่อน

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: |
        คืน envelope มาตรฐานพร้อม `data.status`, `data.timestamp` (ISO 8601), `data.uptime` (วินาที)
      operationId: getHealth
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
              examples:
                ok:
                  summary: Healthy
                  value:
                    success: true
                    code: SUCCESS
                    message: null
                    data:
                      status: ok
                      timestamp: '2026-04-16T12:00:00.000Z'
                      uptime: 12.34
        '400':
          description: |
            Handler ปัจจุบันไม่คืน `400` สำหรับ `GET /health` — ระบุเพื่อให้สอดคล้องกับ OpenAPI lint (operation-4xx-response)
        '500':
          description: Unexpected server error (กรณี handler ล้มเหลว)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/me:
    get:
      tags: [Identity]
      summary: Trusted user context (headers จาก gateway)
      description: |
        คืนข้อมูลจาก **`x-user-id`** และ **`x-user-role`** หลังตรวจ **`x-gateway-secret`** แล้ว

        **เงื่อนไขฝั่ง gateway (เมื่อ client ยิงผ่าน proxy):** `ROUTES_JSON` ชี้ internal-api + `stripPrefix: false` สำหรับ path นี้; `GATEWAY_SECRET` ตรงกัน; `JWT_JWKS_URL` ชี้ JWKS ของ auth — ดู [`openapi-via-gateway.yaml`](./openapi-via-gateway.yaml) สำหรับตัวอย่าง client
      operationId: getMe
      security:
        - GatewaySecret: []
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
              examples:
                demo:
                  summary: After gateway inject
                  value:
                    success: true
                    code: SUCCESS
                    message: null
                    data:
                      userId: '507f1f77bcf86cd799439011'
                      role: user
                    requestId: 826f9b0a-49b5-40c3-88d5-2e12d3f73a97
        '400':
          description: Missing or invalid trusted identity headers (เช่น ไม่มี `x-user-id` หรือยาวเกินกำหนด)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                missingUser:
                  value:
                    success: false
                    code: INVALID_PARAM
                    message: Missing trusted x-user-id
                    data: null
                    requestId: req-1
        '403':
          description: Missing or invalid `x-gateway-secret`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                forbidden:
                  value:
                    success: false
                    code: FORBIDDEN
                    message: Invalid or missing gateway secret
                    data: null
                    requestId: req-1
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    GatewaySecret:
      type: apiKey
      in: header
      name: x-gateway-secret
      description: |
        Shared secret ต้องตรงกับ env **`GATEWAY_SECRET`** ของ service นี้และค่า **`GATEWAY_SECRET`** บน gateway-service
        (gateway inject header นี้เมื่อ proxy — client ห้ามถือ secret นี้)

  parameters:
    XUserId:
      name: x-user-id
      in: header
      required: true
      description: |
        ตั้งโดย **gateway-service** จาก JWT claim (`JWT_CLAIM_USER_ID` / default `sub`) — ASCII printable, max 128
      schema:
        type: string
        maxLength: 128
    XUserRole:
      name: x-user-role
      in: header
      required: false
      description: |
        ตั้งโดย **gateway-service** จาก JWT claim (`JWT_CLAIM_ROLE`) — string หรือ comma-separated, max 256
      schema:
        type: string
        maxLength: 256
    XRequestId:
      name: x-request-id
      in: header
      required: false
      description: Correlation id — ส่งกลับใน `requestId` เมื่อมี
      schema:
        type: string
        maxLength: 128

  schemas:
    HealthEnvelope:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          nullable: true
        data:
          type: object
          required: [status, timestamp, uptime]
          properties:
            status:
              type: string
              example: ok
            timestamp:
              type: string
              format: date-time
              description: ISO 8601
            uptime:
              type: number
              description: Process uptime in seconds
        requestId:
          type: string
          description: Present when request included `x-request-id`

    MeEnvelope:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          nullable: true
        data:
          type: object
          required: [userId]
          properties:
            userId:
              type: string
              description: Trusted user id (string)
            role:
              type: string
              nullable: true
              description: Role string from gateway; null if empty
        requestId:
          type: string
          nullable: true

    ErrorEnvelope:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          enum: [FORBIDDEN, INVALID_PARAM, INTERNAL_ERROR, DATA_NOT_FOUND]
        message:
          type: string
          nullable: true
        data:
          description: Always null for documented errors
          nullable: true
          type: object
        requestId:
          type: string
          nullable: true
