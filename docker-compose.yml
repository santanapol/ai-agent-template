# Local dev dependencies for access-platform (O-16 / D3 `token_gen`).
# Usage: from this directory — `docker compose up -d redis`
#
# Point auth + gateway `.env` at the same URL:
#   REDIS_URL=redis://127.0.0.1:6379/0

services:
  redis:
    image: redis:7-alpine
    container_name: access-platform-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
