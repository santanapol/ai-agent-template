name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            # ไปที่โฟลเดอร์โปรเจกต์
            cd /var/www/zero-platform
            
            # ดึงโค้ดล่าสุด
            git pull origin main
            
            # ---------------------------------------------------------
            # 1. จัดการ Backend
            # ---------------------------------------------------------
            # อัปเดต dependencies ของ Auth
            cd backend/auth && npm ci && cd ../..
            
            # อัปเดต dependencies ของ Gateway
            cd backend/gateway && npm ci && cd ../..
            
            # อัปเดต dependencies ของ Demo Service
            cd backend/service/demo-service && npm ci && cd ../..
            
            # อัปเดต dependencies ของ Staff Service
            cd backend/service/staff && npm ci && cd ../..
            
            # อัปเดต dependencies ของ Agent Invoice Service
            cd backend/service/agent-invoice && npm ci && cd ../..
            
            # สั่งรีสตาร์ท Backend ทั้งหมดด้วย PM2
            pm2 reload backend/ecosystem.config.js --update-env
            
            # ---------------------------------------------------------
            # 2. จัดการ Frontend
            # ---------------------------------------------------------
            cd frontend/backoffice
            npm ci
            npm run build
            cd ../..
            
            echo "Deployment Successful! 🚀"
