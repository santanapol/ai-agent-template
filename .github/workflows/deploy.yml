name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /var/www/zero-platform
            git pull origin main

            # Backend + frontend — npm ci per package (no root workspace)
            bash backend/scripts/install-all-deps.sh

            pm2 startOrReload backend/ecosystem.config.js --update-env

            npm run build --prefix frontend/backoffice

            echo "Deployment Successful! 🚀"
