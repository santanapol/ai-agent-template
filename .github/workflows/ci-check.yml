name: CI Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend-checks:
    name: Backend CI Checks
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            workspace: true
          - service: gateway
            workspace: true
          - service: service/staff
            workspace: true
          - service: service/agent-invoice
            workspace: true
            env_file: .env.test
          - service: service/demo-service
            workspace: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (monorepo workspace)
        if: matrix.workspace == true
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Node.js (standalone service)
        if: matrix.workspace != true
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/${{ matrix.service }}/package-lock.json

      - name: Install monorepo workspaces
        if: matrix.workspace == true
        run: npm ci

      - name: Install service dependencies
        if: matrix.workspace != true
        working-directory: backend/${{ matrix.service }}
        run: npm ci

      - name: Prepare test environment
        if: matrix.env_file
        working-directory: backend/${{ matrix.service }}
        run: cp "${{ matrix.env_file }}" .env

      - name: Run CI Suite (Lint, Test, OpenAPI, Audit)
        working-directory: backend/${{ matrix.service }}
        run: npm run ci

  frontend-checks:
    name: Frontend CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/backoffice/package-lock.json

      - name: Install Dependencies
        working-directory: frontend/backoffice
        run: npm ci

      - name: Run Lint
        working-directory: frontend/backoffice
        run: npm run lint

      - name: Run Tests
        working-directory: frontend/backoffice
        run: npm run test

      - name: Dry Run Build
        working-directory: frontend/backoffice
        run: npm run build
