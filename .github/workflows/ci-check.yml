name: CI Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend-checks:
    name: Backend CI Checks
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
          - service: gateway
          - service: service/staff
          - service: service/agent-invoice
            env_file: .env.test
          - service: service/smart-report
            env_file: .env.test
          - service: service/branch-report
            env_file: .env.test
          - service: service/demo-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/${{ matrix.service }}/package-lock.json

      - name: Install Dependencies
        working-directory: backend/${{ matrix.service }}
        run: npm ci

      - name: Prepare test environment
        if: matrix.env_file
        working-directory: backend/${{ matrix.service }}
        run: cp "${{ matrix.env_file }}" .env

      - name: Run CI Suite (Lint, Test, OpenAPI, Audit)
        working-directory: backend/${{ matrix.service }}
        run: npm run ci

  frontend-next-checks:
    name: Frontend CI Checks (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/backoffice-next/package-lock.json

      - name: Install Dependencies
        working-directory: frontend/backoffice-next
        run: npm ci --legacy-peer-deps

      - name: Run Lint
        working-directory: frontend/backoffice-next
        run: npm run lint

      - name: Run Tests
        working-directory: frontend/backoffice-next
        run: npm test

      - name: Dry Run Build
        working-directory: frontend/backoffice-next
        run: npm run build

  docs-checks:
    name: Docs Knowledge Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run docs-lint
        run: node scripts/docs-lint.mjs
