name: CI Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-checks:
    name: Backend CI Checks
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
          - service: gateway
          - service: service/staff
            env_file: .env.test
          - service: service/agent-invoice
            env_file: .env.test
          - service: service/smart-report
            env_file: .env.test
          - service: service/branch-report
            env_file: .env.test
          - service: service/demo-service
            env_file: .env.test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/${{ matrix.service }}/package-lock.json

      - name: Install Dependencies
        working-directory: backend/${{ matrix.service }}
        run: npm ci

      - name: Prepare test environment
        if: matrix.env_file
        working-directory: backend/${{ matrix.service }}
        run: cp "${{ matrix.env_file }}" .env

      - name: Run CI Suite (Lint, Test, OpenAPI, Audit)
        working-directory: backend/${{ matrix.service }}
        run: npm run ci

  frontend-next-checks:
    name: Frontend CI Checks (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/backoffice-next/package-lock.json

      - name: Install Dependencies
        working-directory: frontend/backoffice-next
        run: npm ci --legacy-peer-deps

      - name: Run Lint
        working-directory: frontend/backoffice-next
        run: npm run lint

      - name: Run Tests
        working-directory: frontend/backoffice-next
        run: npm test

      - name: Dry Run Build
        working-directory: frontend/backoffice-next
        run: npm run build

  docs-checks:
    name: Docs Knowledge Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run docs-lint
        run: node scripts/ci/docs-lint.mjs

  harness-schema-verify:
    name: Harness schema verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend deps
        run: ./backend/scripts/install-all-deps.sh

      - name: Generate harness env (PORT_OFFSET=0)
        run: |
          mkdir -p /tmp/harness-ci
          node scripts/dev/dev-generate-env.mjs /tmp/harness-ci 0

      - name: init-db (validator-bearing services)
        run: |
          node --env-file=backend/auth/.env.harness backend/auth/scripts/init-db.mjs
          node --env-file=backend/service/staff/.env.harness backend/service/staff/scripts/init-db.mjs
          node --env-file=backend/service/agent-invoice/.env.harness backend/service/agent-invoice/scripts/init-db.mjs
          node --env-file=backend/service/smart-report/.env.harness backend/service/smart-report/scripts/init-db.mjs

      - name: verify harness schema
        run: ./scripts/dev/verify-harness-schema.sh

  redis-revoke-gateway-e2e:
    name: Redis revoke gateway E2E (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/auth/package-lock.json
            backend/gateway/package-lock.json

      - name: Install dependencies
        run: |
          cd backend/auth && npm ci
          cd ../gateway && npm ci

      - name: Prepare harness env
        run: node scripts/dev/dev-generate-env.mjs .dev-run/0 0

      - name: Init auth database and seed
        run: |
          node --env-file=backend/auth/.env.harness backend/auth/scripts/init-db.mjs
          node --env-file=backend/auth/.env.harness backend/auth/scripts/seed-example-data.mjs
          node --env-file=backend/auth/.env.harness backend/auth/scripts/seed-permissions.js

      - name: Start auth and gateway
        run: |
          # shellcheck source=scripts/dev/dev-lib.sh
          source scripts/dev/dev-lib.sh
          dev_load_ports
          dev_start_service auth backend/auth backend/auth/.env.harness
          dev_start_service gateway backend/gateway backend/gateway/.env.harness
          dev_wait_http "http://127.0.0.1:${AUTH_PORT}/healthz" "auth"
          dev_wait_http "http://127.0.0.1:${GATEWAY_PORT}/healthz" "gateway"

      - name: Run Redis revoke gateway E2E
        run: ./scripts/ci/redis-revoke-gateway-e2e.sh
