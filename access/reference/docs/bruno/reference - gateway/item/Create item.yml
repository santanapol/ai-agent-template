info:
  name: Create item
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/items"
  body:
    type: json
    data: |-
      {
        "code" : "FRT-APP-03",
        "name" : "Envy Apple",
        "description" : "แอปเปิ้ลเอ็นวี่ เนื้อกรอบ รสหวานฉ่ำ มีกลิ่นหอมเฉพาะตัว นำเข้าจากนิวซีแลนด์",
        "status" : "active",
        "tags" : [ "imported", "crunchy", "sweet" ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Created
    request:
      url: "{{baseUrl}}/api/v1/items"
      method: POST
      headers:
        - name: x-user-id
          value: <x-user-id>
        - name: x-user-ou
          value: <x-user-ou>
        - name: x-user-branch
          value: <x-user-branch>
        - name: x-gateway-secret
          value: "{{apiKey}}"
      body:
        type: json
        data: |-
          {
            "code": "",
            "name": "",
            "description": "",
            "status": "draft",
            "tags": []
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
