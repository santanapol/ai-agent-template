info:
  name: List items
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/items"
  headers:
    - name: x-user-id
      value: 69e988b8e9e5870b957e51ee
    - name: x-user-ou
      value: 69e988b8e9e5870b957e51ec
    - name: x-user-branch
      value: 69e988b8e9e5870b957e51ed
    - name: x-gateway-secret
      value: "{{apiKey}}"
  auth:
    type: apikey
    key: x-gateway-secret
    value: "{{apiKey}}"
    placement: header

runtime:
  variables:
    - name: apiKey
      value: WSgEKTV8ci7UguW6qRDPsMJNBnI4l7lU

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
