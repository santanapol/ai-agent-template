    description: Success
    request:
      url: "{{baseUrl}}/api/v1/items"
      method: GET
      headers:
        - name: x-user-id
          value: <x-user-id>
        - name: x-user-ou
          value: <x-user-ou>
        - name: x-user-branch
          value: <x-user-branch>
        - name: x-gateway-secret
          value: "{{apiKey}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "code": "",
            "message": "",
            "data": [
